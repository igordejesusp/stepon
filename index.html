<title>StepOn</title>

<script>
// no iPhone aberto pela Tela de Início (barra de status transparente) a página recebe a altura da tela menos a barra de status,
// e sobra uma faixa preta embaixo; aqui o app ocupa a altura real da tela, em qualquer modelo e orientação
try{if(JSON.parse(localStorage.getItem('br.tema')||'"dark"')==='light')document.documentElement.dataset.theme='light'}catch(e){}
(function(){
  const fit=()=>{let h=innerHeight;
    if(navigator.standalone){const deitado=innerWidth>innerHeight,s=deitado?Math.min(screen.width,screen.height):Math.max(screen.width,screen.height);h=Math.max(h,s)}
    document.documentElement.style.setProperty('--app-h',h+'px')};
  fit();addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,300));
})();
</script>
<style>

/* páginas modernas */
.stc{padding:16px}.stg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 14px}.stg.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.stg span{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--dim)}.stg b{display:block;font-size:24px;line-height:1.15;margin-top:3px;font-family:var(--m);color:var(--hi);white-space:nowrap}
.stg b.ok{color:var(--blue)}.stg b.bad{color:var(--red)}.stg b.warn{color:var(--amber)}.stg small{display:block;font-size:11px;color:var(--dim);margin-top:2px}
.gcard{padding:14px 16px}.gcard .blh{margin-bottom:8px}
.dica{display:flex;gap:12px;align-items:flex-start;padding:14px 16px}.dica p{margin:2px 0 0;font-size:13px;line-height:1.5;color:var(--txt)}
.li-t{font-family:var(--m);font-size:13px;font-weight:800;color:var(--blue)}.li-dot{width:14px;height:14px;border-radius:50%;display:block}.mt b:empty{display:none}
.vo2b{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}.vo2b b{font-size:44px;font-family:var(--m);color:var(--hi);line-height:1}.vo2b span{color:var(--dim);font-size:13px}.vo2b i{font-style:normal;margin-left:auto;background:rgba(74,158,255,.16);color:var(--blue);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:600}

/* emblemas das conquistas um pouco maiores */
.badge .hx{width:52px;height:52px}.badge b{font-size:12px;color:var(--hi)}.badge small{font-size:10px}.bgrid{margin-top:4px}.bgrid .badge{background:var(--cell)}
/* conquistas: escudos (borda azul, fundo preto, escrita branca); bloqueadas apagadas com cadeado */
.badge.cq{background:none;border:0;box-shadow:none;padding:6px 2px 4px;gap:4px}.badge.cq.lock{opacity:1}
.esc{width:76px;height:85px;display:block;overflow:visible}.bgrid .esc{width:62px;height:70px}
.esc .eb0{stroke:#0a2a52;fill:#050608}.esc .eb1{stroke:var(--blue);fill:none}.esc .eb2{stroke:#4a9eff;opacity:.35}
.esc.on{filter:drop-shadow(0 4px 10px rgba(74,158,255,.28))}.esc .et1{fill:#fff}.esc .et2{fill:#9fc9ff}.esc .et3{fill:#9fc9ff}
.esc.off .eb0{stroke:#15191e;fill:#0c0e11}.esc.off .eb1{stroke:#2a3038}.esc.off .eb2{stroke:#3a424c;opacity:.4}.esc.off .et1,.esc.off .et2,.esc.off .et3{fill:#3d454f}
.esc .ecad{fill:#1b2027;stroke:#2f3640;stroke-width:1}.esc .ecadl{stroke:#8a929e}
:root[data-theme="light"] .esc.off .eb0{stroke:#dfe5ec;fill:#eef2f6}:root[data-theme="light"] .esc.off .eb1{stroke:#c9d2dc}:root[data-theme="light"] .esc.off .et1,:root[data-theme="light"] .esc.off .et2,:root[data-theme="light"] .esc.off .et3{fill:#b7c1cc}:root[data-theme="light"] .esc .ecad{fill:#fff;stroke:#c9d2dc}:root[data-theme="light"] .esc .ecadl{stroke:#7d8995}
.badge.cq b{font-size:12.5px;line-height:1.25;color:var(--hi)}.badge.cq small{font-size:11px;line-height:1.3;color:var(--dim)}.badge.cq.lock b{color:var(--dim)}
.cqh{display:flex;align-items:baseline;justify-content:space-between;margin:18px 2px 6px}.cqh .sec{margin:0}.cqh small{color:var(--dim);font-size:12px;font-weight:600}
.cqg{gap:10px 6px}.cqmais{display:flex;align-items:center;justify-content:center;gap:4px;width:100%;margin-top:6px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--cell);color:var(--blue);font:600 13px var(--f);cursor:pointer}
.cqmais svg,.mk2s svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
/* melhores marcas: só o RP aparece; do 2º fica uma pontinha, que abre com um toque */
.mk2{position:relative;max-height:22px;overflow:hidden;transition:max-height .3s ease;cursor:pointer}
.mk2:after{content:"";position:absolute;left:0;right:0;bottom:0;height:22px;background:linear-gradient(transparent,var(--panel));pointer-events:none;transition:opacity .2s}
.mk2 .mrow{opacity:.55;transition:opacity .2s}.mk2.on{max-height:240px}.mk2.on:after{opacity:0}.mk2.on .mrow{opacity:1}
.mk2s{position:absolute;right:2px;bottom:1px;color:var(--dim);z-index:1;display:flex}.mk2.on .mk2s{display:none}
/* títulos de seção: sem o pontinho, um pouco maiores e em negrito */
.sec:before{display:none}
.sec{font-size:15px;font-weight:800;color:var(--hi);letter-spacing:0}.sec small{font-size:12px;font-weight:600}

.desemb{flex:none}.fdes{display:flex;align-items:center;gap:8px;background:rgba(240,194,75,.12);border:1px solid rgba(240,194,75,.35);color:#f6d27a;border-radius:12px;padding:7px 10px;margin:-2px 0 10px;font-size:13px}.fdes b{color:#ffe08a}
:root[data-theme="light"] .fdes{color:#7a5a08}:root[data-theme="light"] .fdes b{color:#5c4204}

/* topo: três tracinhos abrem Mais; barra de baixo: a foto abre o Perfil */
#menu svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
:root:not([data-theme="light"]) #top .gb#menu{color:var(--vidro-ic)}
.tabav{position:relative;width:26px;height:26px;display:block}.tabav img{width:26px;height:26px;border-radius:50%;object-fit:cover;display:block;border:1.5px solid transparent;background:var(--cell)}
#tabbar button.on .tabav img{border-color:var(--blue)}
.tabav i{position:absolute;right:-2px;bottom:-2px;width:9px;height:9px;border-radius:50%;background:var(--dim);border:2px solid var(--bg)}.tabav i.on{background:var(--ok)}.tabav i.off{background:var(--red)}

.fdesw{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 10px}
.fdes{display:inline-flex;align-items:center;gap:6px;background:rgba(240,194,75,.10);border:1px solid rgba(240,194,75,.28);color:#e9c766;border-radius:99px;padding:3px 10px 3px 4px;margin:0;font-size:11.5px;line-height:1.3}
.fdes b{color:#f3d27a;font-weight:700}.fdes i{width:18px;height:18px;border-radius:50%;background:#f0c24b;display:flex;align-items:center;justify-content:center;flex:none}
.fdes i svg{width:12px;height:12px;fill:none;stroke:#3a2a05;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.pin{border:3px solid #4a9eff}.swc{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:6px}.swc button{aspect-ratio:1/1;border-radius:50%;border:3px solid transparent;padding:0}.swc button.on{border-color:var(--hi);box-shadow:0 0 0 2px var(--bg) inset}
.terrdot{width:26px;height:26px;border-radius:50%;flex:none;box-shadow:0 0 0 3px rgba(255,255,255,.15)}

/* ================= computador (tela grande e mouse): barra no topo, painel em colunas ================= */
.dbrand{display:none}
body.desk #top,:root[data-theme="light"] body.desk #top{position:fixed;top:0;left:0;right:0;height:64px;padding:0 24px;background:var(--panel);border-bottom:1px solid var(--line);pointer-events:auto;gap:12px;z-index:12}
body.desk .dbrand{display:flex;align-items:center;gap:10px;cursor:pointer;order:0}body.desk .dbrand img{height:30px}body.desk .dbrand b{font-size:20px;font-weight:800;color:var(--hi);letter-spacing:-.01em}
body.desk #top .tsp{order:2}body.desk #tema{order:3}body.desk #sync{order:4}body.desk #menu{order:5}
body.desk #top .gb{width:40px;height:40px;min-width:40px;background:transparent;border:1px solid var(--line);box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;color:var(--txt)}
body.desk #top .gb:hover{background:var(--cell)}
:root body.desk #tabbar,:root[data-theme="light"] body.desk #tabbar{position:fixed;top:0;bottom:auto;left:50%;right:auto;transform:translateX(-50%);width:auto;height:64px;padding:0;border:0;border-radius:0;background:transparent;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;z-index:13;gap:4px}
body.desk #tabbar button{flex:none;flex-direction:row;gap:8px;padding:0 16px;height:64px;border-radius:0;font-size:14px;font-weight:600;opacity:1;color:var(--dim);border-bottom:3px solid transparent}
body.desk #tabbar button:hover{color:var(--hi)}body.desk #tabbar button.on{background:transparent;color:var(--hi);border-bottom-color:var(--blue)}
body.desk #tabbar svg{width:20px;height:20px}body.desk .tabav,body.desk .tabav img{width:24px;height:24px}
body.desk .view{top:64px;bottom:0;padding:24px 32px 40px}body.desk #v-comp{padding:0}
body.desk #v-comp .cbar{top:16px}body.desk #v-comp .fab{bottom:24px}body.desk #v-comp .maplibregl-ctrl-bottom-left,body.desk #v-comp .maplibregl-ctrl-bottom-right{bottom:0}
body.desk #recfab{display:none!important}
body.desk #toast{top:80px}
body.desk .wrap{max-width:1280px;margin:0 auto}
body.desk:not(.ob) #ini{columns:auto}
body.desk #perf{columns:auto;max-width:900px}body.desk #mais{max-width:1100px}
body.desk #sheet .box{width:min(760px,92vw)}
body.desk .pgc{max-height:250px}
.dgrid{display:grid;grid-template-columns:300px minmax(0,1fr) 320px;gap:24px;align-items:start}
.dgrid aside{position:sticky;top:0;display:flex;flex-direction:column;gap:0}.dgrid .dc{min-width:0}.dgrid .dc>.sec:first-child,.dgrid .dc>.card:first-child{margin-top:0}
.dperf{padding:18px}.dperf-top{display:flex;align-items:center;gap:12px;cursor:pointer}.dperf-top>div{flex:1;min-width:0}.dperf-top h2{font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dstat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}.dstat span{display:block;font-size:11px;color:var(--dim)}.dstat b{display:block;font-size:22px;font-family:var(--m);color:var(--hi)}.dstat small{font-size:10px;color:var(--dim)}
.dsem{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--cell)}.dsem span{font-size:12px;color:var(--dim)}.dsem b{font-family:var(--m);color:var(--hi)}
body.desk .fcard{padding:18px}body.desk .card.blc{cursor:pointer}body.desk .card.blc:hover,body.desk .fcard:hover{border-color:#3a4654}

.fjunto{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--txt);margin:-4px 0 10px}.fjunto:empty{display:none}
.fjav{display:flex}.fjav img{width:22px;height:22px;border-radius:50%;object-fit:cover;border:2px solid var(--panel);margin-left:-6px;background:var(--cell)}.fjav img:first-child{margin-left:0}
.mkck{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;flex:none}.mkck.on{background:var(--blue);border-color:var(--blue)}
</style>
</head>
<body>
<header id="top">
  <div class="dbrand" onclick="go('ini')"><img src="logo.svg" alt=""><b>StepOn</b></div>
  <button id="tema" class="gb" onclick="togTema()" aria-label="Trocar tema"></button>
  <b id="ttl" hidden></b><span class="tsp"></span>
  <button id="sync" class="b sm gb" title="Sincronizar" aria-label="Sincronizar"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.3-4.9L4 8"/><path d="M4 4v4h4"/><path d="M4 13a8 8 0 0 0 14.3 4.9L20 16"/><path d="M20 20v-4h-4"/></svg></button>
  <button id="menu" class="gb" aria-label="Mais"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
</header>

<main>
  <section class="view on" id="v-ini"><div class="wrap" id="ini"></div></section>
  <section class="view" id="v-cal"><div class="wrap" id="cal"></div></section>
  <section class="view" id="v-des"><div class="wrap" id="des"></div></section>
  <section class="view" id="v-comp"><div class="wrap" id="comp"></div></section>
  <section class="view" id="v-mais"><div class="wrap" id="mais"></div></section>
  <section class="view" id="v-perf"><div class="wrap" id="perf"></div></section>
</main>

<nav id="tabbar">
  <button data-v="ini" class="on"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9H3z"/><path d="M9 20v-6h6v6"/></svg>Início</button>
  <button data-v="cal"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="1"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Calendário</button>
  <button data-v="des"><svg viewBox="0 0 24 24"><path d="M6 3v18M6 4h11l-2 4 2 4H6"/></svg>Desafios</button>
  <button data-v="comp"><svg viewBox="0 0 24 24"><path d="M3 6.5l6-2.5 6 2.5 6-2.5v13.5l-6 2.5-6-2.5-6 2.5z"/><path d="M9 4v13.5M15 6.5V20"/></svg>Mapa</button>
  <button data-v="perf"><span class="tabav"><img id="avimg" src="logo.svg" alt=""><i id="avst"></i></span>Perfil</button>
</nav>

<div id="sheet"><div class="box" id="sbox"></div></div>
<button id="recfab" onclick="openRec()" aria-label="Gravar corrida"><i></i><span id="recfab-t"></span></button>
<div id="rec"></div>
<div id="toast"></div>

  if(rest>100){const h=hr.slice(i0).filter(Boolean);out.splits.push({km:k-1+rest/1000,part:rest,t:t[t.length-1]-t0,hr:h.length?Math.round(h.reduce((x,y)=>x+y,0)/h.length):null,el:alt.length?Math.round(alt[alt.length-1]-alt[i0]):null})}
  // melhores esforços (janela deslizante)
  for(const [dist] of BE){
    if(d[d.length-1]<dist)continue;
    let j=0,best=Infinity;
    for(let i=0;i<d.length;i++){
      while(j<d.length&&d[j]-d[i]<dist)j++;

      if(tt>0&&tt<best)best=tt;
    }
    if(isFinite(best))out.best[dist]=Math.round(best);

  if(hr.length===t.length){

    if(tot>1200){let acc=0,h1=[0,0,0],h2=[0,0,0];for(const x of mv){const h=(acc+=x[0])<=tot/2?h1:h2;h[0]+=x[0];h[1]+=x[1];h[2]+=x[2]*x[0]}
      const e1=(h1[1]/h1[0])/(h1[2]/h1[0]),e2=(h2[1]/h2[0])/(h2[2]/h2[0]),dec=Math.round((e1-e2)/e1*1000)/10;if(Math.abs(dec)<=30)out.dec=dec}
  }

  const n=Math.max(1,Math.floor(t.length/180));const P=[],H=[],T=[];
  for(let i=n;i<t.length;i+=n){const dd=d[i]-d[i-n],tt=t[i]-t[i-n];P.push(dd>0?tt/dd*1000:null);H.push(hr[i]||null);T.push(Math.round(t[i]))}
  out.chart={p:P,h:H,t:T};
  // trajeto reduzido (até ~300 pontos); o Intervals manda a latitude em data e a longitude em data2
  if(ll&&ll.data&&ll.data2){const la=ll.data,lo=ll.data2,st=Math.max(1,Math.ceil(la.length/300)),tr=[];
    const ix=[];for(let i=0;i<la.length;i+=st)ix.push(i);if(ix[ix.length-1]!==la.length-1)ix.push(la.length-1);
    for(const i of ix){if(la[i]==null||lo[i]==null||(!la[i]&&!lo[i]))continue;const q=tr[tr.length-1];
      if(q&&Math.abs(la[i]-q[0])+Math.abs(lo[i]-q[1])>0.005)continue; // salto de GPS
      tr.push([+la[i].toFixed(5),+lo[i].toFixed(5)])}
    if(tr.length>1)out.map=tr}
  return out;
}

function loadOf(a){
  if(a.load!=null)return a.load;
  if(a.hr&&a.mov){const r=clamp((a.hr-CFG.fcrep)/(CFG.fcmax-CFG.fcrep),0,1);return a.mov/60*r*0.64*Math.exp(1.92*r)}
  return 0;
}
function pmc(){ // CTL 42 d, ATL 7 d (EWMA), TSB = CTL − ATL do dia anterior
  const byDay={};for(const a of D.acts){const k=a.date.slice(0,10);byDay[k]=(byDay[k]||0)+loadOf(a)}
  const t=TODAY();let d=addD(t,-400),ctl=0,atl=0;const S=[];
  while(d<=t){const L=byDay[ymd(d)]||0;const tsb=ctl-atl;ctl+=(L-ctl)/42;atl+=(L-atl)/7;S.push({d:ymd(d),L,ctl,atl,tsb});d=addD(d,1)}
  return S;
}
// VDOT (Daniels & Gilbert)
function vdot(dist,sec){const m=sec/60,v=dist/m;const vo2=-4.6+0.182258*v+0.000104*v*v;const p=0.8+0.1894393*Math.exp(-0.012778*m)+0.2989558*Math.exp(-0.1932605*m);return vo2/p}
function predict(V,dist){let lo=dist/1000*120,hi=dist/1000*600;for(let i=0;i<50;i++){const mid=(lo+hi)/2;vdot(dist,mid)>V?lo=mid:hi=mid}return (lo+hi)/2}
function bests(days){
  const lim=days?ymd(addD(TODAY(),-days)):'0';const B={};
  for(const a of D.acts){if(!isRun(a)||a.date<lim||a.type==='TrailRun'||/trilha|trail/i.test(a.name||''))continue;const x=AX[a.id];if(!x||!x.best)continue;
    for(const k in x.best){if(!B[k]||x.best[k]<B[k].t)B[k]={t:x.best[k],id:a.id,date:a.date}}
    // corrida com a distância exata: vale o tempo em movimento (sem as paradas)
    for(const [dist] of BE){if(a.dist>=dist*0.99&&a.dist<=dist*1.05&&a.mov){const tt=Math.round(a.mov*dist/a.dist);if(!B[dist]||tt<B[dist].t)B[dist]={t:tt,id:a.id,date:a.date}}}}
  return B;
}

function paceZones(V){ // ritmos de treino a partir do VDOT (% do VO2 máx)
  const vv=(v)=>{let lo=100,hi=500;for(let i=0;i<40;i++){const mid=(lo+hi)/2;(-4.6+0.182258*mid+0.000104*mid*mid)<v?lo=mid:hi=mid}return lo};
  const p=f=>60000/vv(V*f);

  const H=vHist().filter(x=>x.Va&&x.V&&Math.abs(x.V-x.Va)>=0.1);
  if(H.length)_pv=_pv.map(p=>{if(PF&&!p.custom)return p;const T=H.filter(x=>x.ds<p.date&&(!p.criado||p.criado<=x.ds));if(!T.length)return p;

// liga cada treino planejado à corrida que o cumpriu: a do próprio dia ou, se não houver, uma corrida até 2 dias
// antes ou depois feita num dia sem treino (treino adiantado ou adiado), com pelo menos 60% dos km planejados
let _mk=null,_mv={};
function casaPlano(){
  const P=plan(),key=_pk+'|'+(D.at||0)+'|'+D.acts.length;if(key===_mk)return _mv;
  const rd={};D.acts.filter(isRun).forEach(a=>{const d=a.date.slice(0,10);(rd[d]=rd[d]||[]).push(a)});
  const comPlano=new Set(P.map(p=>p.date)),orf=Object.keys(rd).filter(d=>!comPlano.has(d)).sort(),usado=new Set(),M={};
  // primeiro os treinos com corrida no próprio dia; depois os pares mais próximos na data e nos km (adiantado ganha no empate)
  const pend=[];for(const p of P){if(rd[p.date])M[p.date]={runs:rd[p.date],de:p.date};else pend.push(p)}
  const par=[];for(const p of pend)for(const d of orf){const df=Math.round((parseD(d)-parseD(p.date))/864e5);if(Math.abs(df)>2)continue;
    const kr=rd[d].reduce((s,a)=>s+(a.dist||0),0)/1000;if(kr<p.km*0.6)continue;par.push({p,d,df,dk:Math.abs(kr-p.km)})}

}

// texto no formato de treino do Intervals.icu (vai para o Garmin)
function toIcu(p){
  const pz=r=>r?(fmtP(Math.min(...r))+'-'+fmtP(Math.max(...r))+'/km Pace'):'Z1 HR';
  // no Intervals "m" é minuto e metro é "mtr"
  const du=x=>/min$/.test(x)?x.replace(/min$/,'m'):/\dm$/.test(x)?x.replace(/m$/,'mtr'):x;
  let out='',i=0;const st=p.steps.map(s=>{const c=[...s];c[1]=du(s[1]);return c});
  while(i<st.length){
    const s=st[i];
    if(s[3]&&st[i+1]&&st[i+1][3]===s[3]){out+=`\n${s[3]}x\n- ${s[1]} ${pz(s[2])}\n- ${st[i+1][1]} ${pz(st[i+1][2])}\n`;i+=2}
    else if(s[3]){out+=`\n${s[3]}x\n- ${s[1]} ${pz(s[2])}\n`;i++}

function coachLast(a){
  const x=AX[a.id]||{},p=planOn(a.date.slice(0,10)),pace=a.mov&&a.dist?a.mov/a.dist*1000:null;
  const z=D.athlete&&D.athlete.run&&D.athlete.run.hr_zones||[148,157,166,175,180,185,194];
  const msg=[];
  // sessão intervalada: ritmo muito variável (coef. de variação > 25%) ou plano de qualidade
  const pv=(x.chart&&x.chart.p||[]).filter(v=>v&&v<900),mu=pv.reduce((s,v)=>s+v,0)/(pv.length||1);
  const cv=pv.length?Math.sqrt(pv.reduce((s,v)=>s+(v-mu)**2,0)/pv.length)/mu:0;
  const fast=[...pv].sort((m,n)=>m-n).slice(0,Math.max(1,Math.round(pv.length*0.15))),fm=fast.length?fast.reduce((s,v)=>s+v,0)/fast.length:0;
  const inter=p?.tipo==='qualidade'||/tiro|interval/i.test(a.name||'')||(cv>0.25&&fm&&fm<330);
  if(inter){
    msg.push(`Sessão intervalada. Trechos rápidos em torno de ${fmtP(fm)}/km, FC máxima ${a.hrmax||'--'} bpm.`);
    if(a.hrmax&&a.hrmax>=CFG.fcmax*0.95)msg.push('Chegou perto da FC máxima: estímulo forte, próximo treino deve ser leve.');
    return (p?`Planejado: ${p.titulo}. `:'')+msg.join(' ');
  }
  if(p){const r=a.dist/1000/p.km;msg.push(r>=0.95?`Treino cumprido: ${km(a.dist)} de ${p.km} km planejados.`:r>=0.8?`Volume quase completo (${Math.round(r*100)}% do planejado).`:`Volume abaixo do planejado (${Math.round(r*100)}%). Sem problema na fase de retorno; não compensar no próximo treino.`)}
  if(a.hr){const zi=z.findIndex(v=>a.hr<=v)+1;msg.push(`FC média ${a.hr} bpm (Z${zi||7})${zi<=2?': esforço aeróbico, base sendo construída.':zi<=4?': sessão moderada a forte.':': sessão intensa, priorizar recuperação.'}`)}
  if(x.dec!=null&&!p?.tipo?.match(/qualidade/))msg.push(x.dec<=5?`Deriva cardíaca ${x.dec}%: boa resistência aeróbica para esta duração.`:`Deriva cardíaca ${x.dec}%: a FC subiu no fim. Sinal de base aeróbica ainda curta; manter rodagens leves.`);
  if(x.splits&&x.splits.length>=3){const s=x.splits.filter(s=>!s.part);if(s.length>=3){const f=s[0].t,l=s[s.length-1].t;msg.push(l<f-5?'Parciais em progressão negativa: boa disciplina de ritmo.':l>f+15?'Ritmo caiu no fim; segurar mais o início.':'Ritmo estável do começo ao fim.')}}
  if(!msg.length&&pace)msg.push(`Ritmo médio ${fmtP(pace)}/km.`);
  return msg.join(' ');
}

function painelDesk(avisos,ultimo,disp,vit,prox,rodape){

  let seq=0;for(let i=0;i<52;i++){const ini=addD(m,-7*i),n=runs.filter(x=>x.date.slice(0,10)>=ymd(ini)&&x.date.slice(0,10)<=ymd(addD(ini,6))).length;if(n>=1)seq++;else if(i>0)break}
  const tm=(TD||[]).find(x=>x.u.me),semana=runs.filter(x=>x.date.slice(0,10)>=ymd(m)).reduce((s,x)=>s+(x.dist||0),0);
  const perfil=`<div class="card dperf"><div class="dperf-top" onclick="go('perf')">${avatar({pic:myPic(),me:1},72)}<div><h2>${esc(a.name||'Atleta')}</h2><div class="meta">${esc(a.city||'')}</div></div>${escudo(nv,"openNiveis()")}</div>
    <div class="dstat"><div><span>Corridas</span><b>${noAno.length}</b><small>em ${yr}</small></div><div><span>Km</span><b>${Math.round(kmAno/1000)}</b><small>em ${yr}</small></div><div><span>Semanas</span><b>${seq}</b><small>seguidas</small></div></div>
    <div class="dsem"><span>Esta semana</span><b>${km(semana).replace('.',',')} km</b></div>
    <button class="b full" style="margin-top:10px" onclick="go('perf')">Ver meu perfil</button></div>`;
  const terr=`<div class="card blc" onclick="go('comp')"><div class="blh"><b>Seu território</b><span>Mapa ›</span></div>${tm?linhaI(`<span class="li-ic" style="background:${tm.cor}33"><span class="li-dot" style="background:${tm.cor}"></span></span>`,fmtKm2(tm.km2),tm.n+' '+(tm.n===1?'circuito':'circuitos')+' fechados',''):linhaI(icoC('prova'),'Nenhuma área ainda','Feche um circuito correndo','')}</div>`;
  const L=D.acts.slice(0,4),DPA=desPorAtiv(runs);
  const feed=L.length?`<div class="sec">Atividades recentes<small><a onclick="PT='ativ';go('perf')" style="cursor:pointer;color:var(--blue)">Ver todas</a></small></div>`+L.map(x=>feedCard({id:x.id,dono:CFG.athlete,nome:a.name||'Atleta',pic:myPic(),date:x.date,titulo:x.name,src:devNome(x),cidade:a.city,dist:x.dist,mov:x.mov,hr:x.hr,run:isRun(x),map:(AX[x.id]||{}).map?'own':null,meu:1,des:DPA[x.id],com:isMk(x)?[x.de]:null})).join(''):'';
  if(L.length)setTimeout(()=>{const K=L.map(x=>CFG.athlete+':'+x.id);socLoad(K);juntosLoad(K);fotosPede(CFG.athlete,render)},0);
  return `<div class="dgrid"><aside class="dl">${perfil}${terr}${blocoDes(runs,TODAY(),"openDesafios()")}</aside>
    <section class="dc">${avisos}${prox}${ultimo}${feed}${rodape}</section>
    <aside class="dr">${disp}${vit}</aside></div>`;
}

let calMode='sem',calRef=TODAY();
function rCal(){

      h+=`<div class="day ${ds===ds0?'today':''}" onclick="openDay('${ds}')"><div class="d"><span>${DOW[d.getDay()]}</span><b>${pad(d.getDate())}</b></div><div style="min-width:0">

      ${ex.map(a=>`<div class="ex">✓ ${typeIc(a)} ${a.dist?km(a.dist)+' km':fmtT(a.mov)}${isRun(a)&&a.dist?' · '+fmtP(a.mov/a.dist*1000)+'/km':''}${a.hr?' · '+a.hr+' bpm':''}</div>`).join('')}</div>
      <div class="vt">${w.sleep?'☾ '+fmtSleep(w.sleep):''}<br>${w.rhr?'♥ '+w.rhr:''}</div></div>`}
    h+='</div>';

  }else{
    const y=calRef.getFullYear(),mo=calRef.getMonth(),f=monday(new Date(y,mo,1));
    h+=`<div class="wk"><button class="b sm" onclick="calGo(-1)">◀</button><b>${MES[mo]} ${y}</b><button class="b sm" onclick="calGo(1)">▶</button></div><div class="mgrid">${['SEG','TER','QUA','QUI','SEX','SÁB','DOM'].map(x=>`<div class="h">${x}</div>`).join('')}`;

  let h=`<div class="hd"><b>${DOW[d.getDay()]} ${ds.split('-').reverse().join('/')}</b><button class="b sm" onclick="closeSheet()">✕</button></div>`;
  if(p)h+=`<div class="card cur"><div class="row" style="justify-content:space-between"><span class="lbl">PLANEJADO · ${tipoIc[p.tipo]}</span>${tagSt[status(p)]}</div><h2 style="margin-top:4px">${esc(p.titulo)}</h2><div class="meta">${p.km} km${(()=>{const m=casaPlano()[ds];return m&&m.de!==ds?' · feito em '+fmtD(m.de):''})()}${p.aj?' · ritmos ajustados pelo teste de '+fmtD(p.aj):''}</div>${stepsHtml(p)}${p.dica?`<p class="empty" style="margin-top:8px">${esc(p.dica)}</p>`:''}${p.why?`<div class="coach"><b>AJUSTE DO COACH</b>${esc(p.why)}</div>`:''}${ds>=ymd(TODAY())&&hasWatch()?`<button class="b pri full" style="margin-top:10px" onclick="sendWatch('${ds}')">▲ Enviar ao relógio</button>`:''}
    ${ds>=ymd(TODAY())?`<button class="b ${hasWatch()?'':'pri'} full" style="margin-top:8px" onclick="fazerTreino('${ds}')">▶ Fazer treino agora</button>`:''}
    <div class="grid g2" style="margin-top:8px">${ds<=ymd(TODAY())&&status(p)!=='cumprido'?`<button class="b" onclick="markDone('${ds}')">✓ Marcar feito</button>`:''}${ds>=ymd(TODAY())||status(p)!=='cumprido'?`<button class="b" onclick="openBuilder('${ds}')">${ds<ymd(TODAY())?'Editar ou mudar a data':'Editar treino'}</button>`:''}</div>${p.teste&&ds<=ymd(TODAY())?`<button class="b full" style="margin-top:8px" onclick="abrirTeste('${ds}',null,${p.teste})">Informar o tempo do teste</button>`:''}</div>`;
  ex.forEach(a=>h+=`<div class="card" onclick="openAct('${a.id}')"><div class="row" style="justify-content:space-between"><span class="lbl">EXECUTADO · ${typeIc(a)}</span>${a.src==='MANUAL'?'<span class="tag">MARCADO À MÃO</span>':''}</div><h2 style="margin-top:4px">${esc(a.name)}</h2><div class="meta">${a.dist?km(a.dist)+' km · ':''}${fmtT(a.mov)}${isRun(a)&&a.dist?' · '+fmtP(a.mov/a.dist*1000)+'/km':''}${a.hr?' · '+a.hr+' bpm':''}</div>${isMan(a)?`<button class="b sm" style="margin-top:8px" onclick="event.stopPropagation();undoMan('${a.id}')">Desfazer</button>`:''}</div>`);
  if(!p&&ex.some(isRun)&&contouPara(ds))h+=`<p class="meta" style="margin:-4px 0 10px">Esta corrida contou como o treino planejado de ${fmtD(contouPara(ds))}.</p>`;
  if(!p&&!ex.length)h+=`<p class="empty">Dia de descanso.</p>`;
  if(!p&&ds>=ymd(TODAY()))h+=`<button class="b full" style="margin:8px 0" onclick="openBib('${ds}')">+ Treino neste dia</button>`;
  if(!p&&!ex.some(isRun)&&ds<=ymd(TODAY()))h+=`<button class="b full" style="margin:8px 0" onclick="markDone('${ds}')">✓ Registrar corrida feita</button>`;
  h+=`<div class="grid g3" style="margin-top:6px"><div class="cell"><div class="lbl">Sono</div><span class="num">${fmtSleep(w.sleep)}</span></div><div class="cell"><div class="lbl">FC rep.</div><span class="num">${w.rhr||'--'}</span></div><div class="cell"><div class="lbl">Passos</div><span class="num">${w.steps?(w.steps/1000).toFixed(1)+'k':'--'}</span></div></div>`;
  openSheet(h);
};

const METAS=[
  {nome:'10 KM EM NOVEMBRO',dist:10000,tempo:3300,ini:'2026-11-01',fim:'2026-11-30',txt:'Correr 10 km em até 55:00 (ritmo de 5:30/km).'},
  {nome:'MEIA MARATONA',dist:21097.5,ini:'2026-11-01',fim:'2026-12-31',txt:'Completar 21,1 km até o fim de dezembro.'},
  {nome:'30 KM',dist:30000,ini:'2026-11-01',fim:'2027-03-31',txt:'Passar o recorde de 26 km e fechar os 30 km.'},
];
// metas editáveis: ficam neste aparelho; enquanto a pessoa não mexe, valem as metas de partida (as do Igor ou a do questionário)
// tipo 'corrida' = uma corrida de X km (com tempo alvo opcional); 'volume' = somar X km entre o início e o prazo
function metas(){
  const L=LS.get('metas',null);if(L)return L;
  if(isIgor()&&!PF)return METAS.map((m,i)=>({id:'m'+(i+1),tipo:'corrida',...m}));
  const M=PF&&META[PF.meta];if(!M||!M.d)return [];
  const P=baseTemplate(),fim=P.length?P[P.length-1].date:PF.inicio;
  return [{id:'plano',tipo:'corrida',nome:M.n.toUpperCase(),dist:M.dist,ini:PF.inicio,fim}];
}
const parseT=s=>{const p=String(s||'').trim().split(':').map(Number);if(!s||p.some(isNaN))return null;return p.length===3?p[0]*3600+p[1]*60+p[2]:p.length===2?p[0]*60+p[1]:p[0]*60};
const kmF=m=>kmTxt(Math.round(m/100)/10);
function metaTxt(m){
  if(m.txt)return m.txt;
  if(m.tipo==='volume')return `Somar ${kmF(m.dist)} km de corrida até ${m.fim.split('-').reverse().join('/')}.`;
  return `Correr ${kmF(m.dist)} km${m.tempo?` em até ${fmtT(m.tempo)} (ritmo de ${fmtP(m.tempo/m.dist*1000)}/km)`:''} até ${m.fim.split('-').reverse().join('/')}.`;
}
function bestIn(a,dist){
  let b=(AX[a.id]&&AX[a.id].best||{})[dist]||null;
  if(a.dist>=dist*0.99&&a.dist<=dist*1.05&&a.mov){const tt=Math.round(a.mov*dist/a.dist);if(!b||tt<b)b=tt}
  return b;
}
function metaStatus(m){
  const hoje=ymd(TODAY()),dias=Math.round((parseD(m.fim)-TODAY())/864e5),janela=D.acts.filter(a=>isRun(a)&&a.date.slice(0,10)>=m.ini&&a.date.slice(0,10)<=m.fim);
  if(m.tipo==='volume'){const tot=janela.reduce((s,a)=>s+(a.dist||0),0);return {ok:tot>=m.dist,tot,prog:tot/m.dist,dias,fora:hoje>m.fim,antes:hoje<m.ini}}
  const maior=Math.max(0,...janela.map(a=>a.dist||0));
  const runs=janela.filter(a=>a.dist>=m.dist*0.99);
  let best=null;for(const a of runs){const t=bestIn(a,m.dist)||a.mov;if(t&&(!best||t<best.t))best={t,a}}
  return {ok:!!best&&(!m.tempo||best.t<=m.tempo),best,prog:best?(m.tempo?Math.min(1,m.tempo/best.t):1):maior/m.dist,maior,dias,fora:hoje>m.fim,antes:hoje<m.ini};
}
function rDes(){
  const t=TODAY(),m=monday(t),runs=D.acts.filter(isRun);
  const sum=(a,b)=>runs.filter(x=>x.date.slice(0,10)>=a&&x.date.slice(0,10)<=b).reduce((s,x)=>s+(x.dist||0),0)/1000;
  const wk=sum(ymd(m),ymd(addD(m,6))),wkPlan=plan().filter(p=>p.date>=ymd(m)&&p.date<=ymd(addD(m,6))).reduce((s,p)=>s+p.km,0)||15;
  const m1=ymd(new Date(t.getFullYear(),t.getMonth(),1)),m2=ymd(new Date(t.getFullYear(),t.getMonth()+1,0));
  const mo=sum(m1,ymd(t)),moAlvo=isIgor()?(t.getMonth()===10?75:60):Math.round(plan().filter(p=>p.date>=m1&&p.date<=m2).reduce((s,p)=>s+p.km,0))||Math.round(wkPlan*4);
  let seq=0;for(let i=0;i<52;i++){const a=addD(m,-7*i),n=runs.filter(x=>x.date.slice(0,10)>=ymd(a)&&x.date.slice(0,10)<=ymd(addD(a,6))).length;if(n>=2)seq++;else if(i>0)break}
  const ch=[
    ['VOLUME DA SEMANA',`${wk.toFixed(1)} / ${wkPlan} km`,wk/wkPlan],
    [`VOLUME DE ${MES[t.getMonth()]}`,`${mo.toFixed(1)} / ${moAlvo} km`,mo/moAlvo],
    ['CONSTÂNCIA',`${seq} / 4 semanas seguidas com 2+ corridas`,seq/4],
  ];
  let h=`<div class="sec">PROGRESSO</div>`;
  h+=ch.map(c=>{const v=clamp(c[2],0,1);return `<div class="card ${v>=1?'cur':''}"><div class="row" style="justify-content:space-between"><span class="lbl" style="color:var(--txt)">${c[0]}</span><span class="num ${v>=1?'ok':''}" style="font-size:12px">${Math.round(v*100)}%</span></div><div class="meta" style="margin-top:3px">${c[1]}</div><div class="bar"><i style="width:${v*100}%"></i></div></div>`}).join('');
  h+=blocoDes(D.acts.filter(isRun),TODAY(),"openDesafios()");
  const M=PF&&META[PF.meta];
  h+=`<div class="sec">OBJETIVO DO PLANO</div><div class="card"><p class="empty" style="color:var(--txt)">${PF?`Seus treinos seguem o objetivo <b style="color:var(--hi)">${M?M.n:'do questionário'}</b>, com os dias e o volume que você informou.`:'Seus treinos seguem o plano de novembro montado pelo Coach.'}</p>
    <p class="empty" style="margin-top:6px">Mudou de objetivo, de dias ou de ritmo? Responda o questionário de novo e o app refaz o plano.</p>
    <button class="b full" style="margin-top:10px" onclick="redoPlan()">Mudar meu objetivo</button></div>`;
  $('#des').innerHTML=h;
}

const ESC={her:'M11 9H89Q93 9 93 13V57Q93 84 50 106Q7 84 7 57V13Q7 9 11 9Z',cmd:'M7 25Q50 1 93 25L76 99Q50 109 24 99Z',fe:'M7 9Q50 27 93 9L93 61Q93 83 50 107Q7 83 7 61Z'};

const fmtSub=s=>s>=3600?Math.floor(s/3600)+'h'+(s%3600?String(Math.round(s%3600/60)).padStart(2,'0'):''):String(Math.round(s/60));
function badgeList(){
  const R=D.acts.filter(isRun).sort((a,b)=>a.date<b.date?-1:1),n=R.length,M=marcasTodas(),out=[];
  const add=(g,f,k,t,nome,on,date,dica)=>out.push({g,f,k,t,nome,on:!!on,date:on?date||null:null,dica});
  // corridas
  for(const c of [1,10,25,50,100,150,200,300,400,500,750,1000])add('CORRIDAS','cmd',c===1?'1ª':String(c),c===1?'corrida':'corridas',c+'ª corrida',n>=c,n>=c?R[c-1].date:null,n>=c?'':`Faltam ${c-n}`);
  // distâncias: a primeira corrida que passou da distância
  const maior=Math.max(0,...R.map(r=>r.dist||0))/1000;
  for(const [d,k,nome] of [[5,'5','5 km'],[10,'10','10 km'],[15,'15','15 km'],[21.1,'21','Meia maratona'],[30,'30',isIgor()?'Passar os 26 km de vida':'30 km'],[42.2,'42','Maratona']]){
    const r=R.find(x=>(x.dist||0)/1000>=d);add('DISTÂNCIAS','her',k,'km',nome,r,r&&r.date,`Maior: ${km(maior*1000).replace('.',',')} km`)}
  // ritmos: o melhor trecho da distância dentro das corridas (como nas melhores marcas)
  const RIT=[[5000,'5K','5 km',[35,30,25,22,20].map(m=>m*60)],[10000,'10K','10 km',[70,60,55,50,45,40].map(m=>m*60)],[21097.5,'21K','Meia',[150,135,120,105,90].map(m=>m*60)],[42195,'42K','Maratona',[300,270,240,210,180].map(m=>m*60)]];
  for(const [d,t,nm,L] of RIT){const ms=(M[d]||[]),bt=ms.length?ms[0].t:null;
    for(const lim of L){const ok=ms.filter(x=>x.t<lim).sort((a,b)=>String(a.date).localeCompare(String(b.date)))[0];
      add('RITMOS','fe',fmtSub(lim),t,nm+' sub '+fmtSub(lim),ok,ok&&ok.date,bt?'Seu melhor: '+fmtT(bt):'Ainda sem marca')}}
  for(const p of [390,360,330,300,270,240]){const r=R.find(x=>x.dist>=5000&&x.mov&&x.mov/x.dist*1000<p),pp=Math.floor(p/60)+':'+String(p%60).padStart(2,'0');
    add('RITMOS','fe',pp,'/km','Ritmo sub '+pp+'/km',r,r&&r.date,'Em corrida de 5 km ou mais')}
  // constância
  const sem=semanasSeguidas();for(const w of [2,4,8,12,26,52])add('CONSTÂNCIA','her',String(w),'semanas',w+' semanas seguidas',sem>=w,null,'2+ corridas por semana · melhor: '+sem);
  const mes={};R.forEach(r=>{const k=r.date.slice(0,7);mes[k]=(mes[k]||0)+(r.dist||0)/1000});const mm=Math.max(0,...Object.values(mes));
  for(const k of [50,100,150,200,300]){const m0=Object.keys(mes).sort().find(x=>mes[x]>=k);add('CONSTÂNCIA','her',String(k),'km no mês',k+' km num mês',m0,m0?m0+'-28':null,'Melhor mês: '+Math.round(mm)+' km')}
  const ka=kmAno();for(const k of [100,250,500,1000,1500,2000])add('CONSTÂNCIA','her',String(k),'km no ano',k+' km no ano',ka>=k,null,Math.round(ka)+' de '+k+' km este ano');
  let ac=0,cr={};R.forEach(r=>{const a0=ac;ac+=(r.dist||0)/1000;for(const k of [250,500,1000,2500,5000])if(a0<k&&ac>=k)cr[k]=r.date});
  for(const k of [250,500,1000,2500,5000])add('CONSTÂNCIA','her',k>=1000?(k/1000)+' mil':String(k),'km total',(k>=1000?(k/1000).toLocaleString('pt-BR')+' mil':k)+' km no total',cr[k],cr[k],`Faltam ${Math.max(0,Math.ceil(k-ac))} km`);
  return out;
}

/* ---------- progresso: as últimas 12 semanas ---------- */
const MES3=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
function semanas(runs){
  const w0=addD(monday(TODAY()),-77),W=[...Array(12)].map((_,i)=>({ini:addD(w0,i*7),dist:0,mov:0,elev:0,n:0,temElev:false}));
  runs.forEach(r=>{const d=parseD(String(r.date).slice(0,10)),i=Math.floor((d-w0)/(7*864e5));if(i<0||i>11)return;const w=W[i];w.dist+=r.dist||0;w.mov+=r.mov||0;if(r.elev!=null){w.elev+=r.elev;w.temElev=true}w.n++});
  return W;
}
const PG={};
function progBox(id,W){PG[id]=PG[id]||{sel:11,met:'dist'};PG[id].W=W;return `<div class="card pg" id="pg-${id}">${progIn(id)}</div>`}
function progIn(id){
  const g=PG[id],W=g.W,s=W[g.sel],fim=addD(s.ini,6),m=g.met;
  const per=s.ini.getMonth()===fim.getMonth()?`${s.ini.getDate()} – ${fim.getDate()} de ${MES3[fim.getMonth()]}. de ${fim.getFullYear()}`:`${s.ini.getDate()} de ${MES3[s.ini.getMonth()]}. – ${fim.getDate()} de ${MES3[fim.getMonth()]}. de ${fim.getFullYear()}`;
  const val=w=>m==='dist'?w.dist/1000:m==='mov'?w.mov/3600:w.elev;
  const vs=W.map(val),mx0=Math.max(...vs,0),st=m==='dist'?(mx0>40?20:mx0>20?10:5):m==='mov'?(mx0>4?2:1):(mx0>400?200:mx0>100?100:50),mx=Math.max(st,Math.ceil(mx0/st)*st);
  const X=i=>16+i*(462/11),Y=v=>160-v/mx*140,pts=vs.map((v,i)=>[X(i),Y(v)]);
  const lin=pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' '),un=m==='dist'?' km':m==='mov'?' h':' m';
  let meses='';W.forEach((w,i)=>{if(i===0||w.ini.getMonth()!==W[i-1].ini.getMonth()){const ix=i===0&&w.ini.getDate()>20?-1:i;if(ix>=0)meses+=`<text x="${X(ix)}" y="198" text-anchor="middle" class="pgm">${MES3[w.ini.getMonth()].replace(/^./,c=>c.toUpperCase())}</text>`}});
  const stat=(k,l,v)=>`<button class="pgs${m===k?' on':''}" onclick="pgMet('${id}','${k}')"><span>${l}</span><b>${v}</b></button>`;
  return `<div class="pgp">${per}</div><div class="pgst">${stat('dist','Distância',km(s.dist).replace('.',',')+' km')}${stat('mov','Tempo',tempoCart(s.mov))}${stat('elev','Elevação',s.temElev?Math.round(s.elev)+' m':'--')}</div>
  <div class="meta" style="margin:10px 0 2px">Últimas 12 semanas · toque nos números para trocar o gráfico</div>
  <svg class="pgc" viewBox="0 0 600 210" onpointerdown="pgMove(event,'${id}')" onpointermove="if(event.buttons||event.pointerType==='mouse')pgMove(event,'${id}')"><defs><linearGradient id="pgg-${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a9eff" stop-opacity=".55"/><stop offset="1" stop-color="#4a9eff" stop-opacity="0"/></linearGradient></defs>
  ${[0,.5,1].map(f=>`<line x1="8" x2="490" y1="${Y(mx*f)}" y2="${Y(mx*f)}" class="pgl"/><text x="500" y="${Y(mx*f)+7}" class="pgy">${+(mx*f).toFixed(1)}${un}</text>`).join('')}
  <polygon points="${X(0)},160 ${lin} ${X(11)},160" fill="url(#pgg-${id})"/><polyline points="${lin}" fill="none" stroke="#4a9eff" stroke-width="3" stroke-linejoin="round"/>
  <line x1="${X(g.sel)}" x2="${X(g.sel)}" y1="14" y2="160" stroke="#fff" stroke-width="1.5"/>
  ${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="${i===g.sel?10:7}" class="${i===g.sel?'pgd on':'pgd'}"/>`).join('')}${meses}</svg>`;
}
window.pgMet=(id,k)=>{PG[id].met=k;$('#pg-'+id).innerHTML=progIn(id)};
window.pgMove=(e,id)=>{const sv=e.currentTarget,r=sv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*600,i=clamp(Math.round((x-16)/(462/11)),0,11);if(i!==PG[id].sel){PG[id].sel=i;$('#pg-'+id).innerHTML=progIn(id)}};

function jpegDe(file){return new Promise((ok,erro)=>{const u=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{let q=.8,mx=1400,out='';for(let k=0;k<5;k++){const s=Math.min(1,mx/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);out=c.toDataURL('image/jpeg',q);if(out.length<850000)break;q-=.12;mx=Math.round(mx*.85)}URL.revokeObjectURL(u);ok(out)};
  im.onerror=()=>{URL.revokeObjectURL(u);erro(new Error('não deu para abrir a imagem'))};im.src=u})}

/* ---------- desafios do mês: o app confere sozinho pelas corridas e marca a atividade que concluiu ---------- */
// tipo: um = numa corrida só; soma = somando o mês (campo); conta = número de corridas (filtro)
const DESAF=[
  {k:'5k',ic:'5K',n:'5K do mês',d:'Correr 5 km numa corrida',tipo:'um',alvo:5000},
  {k:'10k',ic:'10K',n:'10K do mês',d:'Correr 10 km numa corrida',tipo:'um',alvo:10000},
  {k:'21k',ic:'21K',n:'Meia do mês',d:'Correr 21,1 km numa corrida',tipo:'um',alvo:21097},
  {k:'25km',ic:'25',n:'25 km no mês',d:'Somar 25 km de corrida no mês',tipo:'soma',campo:'dist',alvo:25000},
  {k:'50km',ic:'50',n:'50 km no mês',d:'Somar 50 km de corrida no mês',tipo:'soma',campo:'dist',alvo:50000},
  {k:'100km',ic:'100',n:'100 km no mês',d:'Somar 100 km de corrida no mês',tipo:'soma',campo:'dist',alvo:100000},
  {k:'5h',ic:'5h',n:'5 horas correndo',d:'Somar 5 horas de corrida no mês',tipo:'soma',campo:'mov',alvo:18000},
  {k:'subida',ic:'500',n:'Subida do mês',d:'Somar 500 m de subida no mês',tipo:'soma',campo:'elev',alvo:500},
  {k:'12x',ic:'12x',n:'12 corridas',d:'Fazer 12 corridas no mês (3 por semana)',tipo:'conta',alvo:12},
  {k:'cedo',ic:'☀',n:'Madrugador',d:'5 corridas começando antes das 7h',tipo:'conta',alvo:5,filtro:r=>+String(r.date).slice(11,13)<7}];
const MESC=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
// resultado dos desafios de um mês a partir de uma lista de corridas {id,date,dist,mov,elev}
function desafiosMes(runs,ano,mes){
  const pre=ano+'-'+String(mes+1).padStart(2,'0'),R=runs.filter(r=>String(r.date).slice(0,7)===pre&&(r.dist||0)>=1000).sort((a,b)=>String(a.date).localeCompare(String(b.date)));
  return DESAF.map(c=>{let v=0,act=null,data=null;
    if(c.tipo==='um'){for(const r of R){v=Math.max(v,r.dist||0);if(!act&&(r.dist||0)>=c.alvo*0.99){act=r.id;data=r.date}}}
    else if(c.tipo==='soma'){for(const r of R){v+=(r[c.campo]||0);if(!act&&v>=c.alvo){act=r.id;data=r.date}}}
    else{for(const r of R){if(c.filtro&&!c.filtro(r))continue;v++;if(!act&&v>=c.alvo){act=r.id;data=r.date}}}
    return {...c,v,ok:!!act,act,data,p:clamp(v/c.alvo,0,1),ano,mes}});
}
const desTxt=(c)=>c.tipo==='um'?`Maior corrida: ${km(c.v).replace('.',',')} de ${km(c.alvo).replace('.',',')} km`:c.campo==='dist'?`${km(c.v).replace('.',',')} de ${c.alvo/1000} km`:c.campo==='mov'?`${tempoCart(c.v)} de 5h`:c.campo==='elev'?`${Math.round(c.v)} de ${c.alvo} m`:`${c.v} de ${c.alvo} corridas`;
// emblema do desafio: anel dourado que enche com o progresso; concluído fica dourado cheio
function desEmb(c,sz=46){const r=20,L=2*Math.PI*r,fs=String(c.ic).length>2?11:13;
  return `<svg class="desemb" viewBox="0 0 48 48" style="width:${sz}px;height:${sz}px"><circle cx="24" cy="24" r="${c.ok?22:r}" fill="${c.ok?'#f0c24b':'rgba(240,194,75,.12)'}"/>${c.ok?'':`<circle cx="24" cy="24" r="${r}" fill="none" stroke="#f0c24b" stroke-width="3.5" stroke-dasharray="${(L*c.p).toFixed(1)} ${L.toFixed(1)}" stroke-linecap="round" transform="rotate(-90 24 24)"/>`}<text x="24" y="${24+fs*.36}" text-anchor="middle" font-size="${fs}" font-weight="800" fill="${c.ok?'#3a2a05':'#f0c24b'}">${c.ic}</text></svg>`}
const desLinha=c=>`<div class="mrow">${desEmb(c)}<div class="mt"><b>${c.n}</b><span>${c.ok?'Concluído em '+fmtD(String(c.data).slice(0,10)):desTxt(c)}</span>${c.ok?'':`<div class="bar" style="margin-top:6px;height:4px"><i style="width:${c.p*100}%;background:#f0c24b"></i></div>`}</div><span class="mv"${c.ok?' style="color:#f0c24b"':''}>${c.ok?'✓':Math.round(c.p*100)+'%'}</span></div>`;
function blocoDes(runs,t,on){
  const L=desafiosMes(runs,t.getFullYear(),t.getMonth()),feitos=L.filter(c=>c.ok).length;
  const top=[...L].sort((a,b)=>(a.ok-b.ok)||(b.p-a.p)).slice(0,3);
  return `<div class="card blc" onclick="${on}"><div class="blh"><b>Desafios de ${MESC[t.getMonth()]}</b><span>${feitos}/${L.length} ›</span></div>${top.map(desLinha).join('')}</div>`;

/* ================= etapas (voltas) do relógio: lê o arquivo original .fit da corrida ================= */
// formato FIT da Garmin: cabeçalho, mensagens de definição e de dados; só as voltas (mensagem 19) interessam
function fitLaps(buf){
  const dv=new DataView(buf),u8=new Uint8Array(buf);
  if(buf.byteLength<14||String.fromCharCode(u8[8],u8[9],u8[10],u8[11])!=='.FIT')return null;
  const hs=u8[0],end=Math.min(buf.byteLength,hs+dv.getUint32(4,true)),defs={},laps=[];let p=hs;
  const INV={1:127,2:255,3:32767,4:65535,5:2147483647,6:4294967295,0:255,13:255};
  const rd=(o,sz,t,le)=>{let v;
    switch(t){case 1:v=dv.getInt8(o);break;case 3:v=dv.getInt16(o,le);break;case 4:case 11:v=dv.getUint16(o,le);break;case 5:v=dv.getInt32(o,le);break;case 6:case 12:v=dv.getUint32(o,le);break;case 0:case 2:case 10:case 13:v=dv.getUint8(o);break;default:return null}
    return INV[t]===v?null:v};
  try{
    while(p<end){
      const h0=u8[p++];
      if(h0&0x80){const d=defs[(h0>>5)&3];if(!d)return null;p+=d.size;continue}
      const lt=h0&0x0f;
      if(h0&0x40){p++;const le=u8[p++]===0,gn=dv.getUint16(p,le);p+=2;const nf=u8[p++],f=[];let size=0;
        for(let i=0;i<nf;i++){f.push([u8[p],u8[p+1],u8[p+2]&0x1f]);size+=u8[p+1];p+=3}
        if(h0&0x20){const nd=u8[p++];for(let i=0;i<nd;i++){size+=u8[p+1];p+=3}} // campos de desenvolvedor
        defs[lt]={gn,le,f,size}}
      else{const d=defs[lt];if(!d)return null;
        if(d.gn===19){let o=p;const m={};for(const [n,sz,t] of d.f){if(n===7||n===8||n===9||n===15||n===16||n===24||n===71){const sizes={0:1,1:1,2:1,3:2,4:2,5:4,6:4,10:1,11:2,12:4,13:1};if(sizes[t]===sz)m[n]=rd(o,sz,t,d.le)}o+=sz}
          laps.push({t:m[8]!=null?m[8]/1000:null,d:m[9]!=null?m[9]/100:null,hr:m[15],hm:m[16],trig:m[24],idx:m[71]})}
        p+=d.size}

// junta voltas seguidas do mesmo passo do treino (o aquecimento de 1,5 km vem em duas voltas: 1 km + 0,5 km)
function mergeLaps(L){
  const V=L.filter(l=>l.t&&l.d);
  // corrida livre com voltas automáticas de 1 km (e a última volta encerrada ao parar o relógio): não é treino por etapas
  if(!V.some(l=>l.idx!=null)&&!V.some((l,i)=>l.trig===0&&l.d>=100&&i<V.length-1))return null;
  const out=[];
  V.forEach((l,i)=>{
    const p=out[out.length-1],ult=i===V.length-1;
    if(p&&((l.idx!=null&&l.idx===p.idx)||(ult&&l.idx==null&&l.d<100))){
      if(l.hr!=null)p.hr=p.hr!=null?(p.hr*p.t+l.hr*l.t)/(p.t+l.t):l.hr;
      p.hm=Math.max(p.hm||0,l.hm||0)||null;p.d+=l.d;p.t+=l.t}
    else out.push({idx:l.idx,d:l.d,t:l.t,hr:l.hr,hm:l.hm});
  });
  return out.length>=2?out.map(e=>({idx:e.idx,d:Math.round(e.d),t:Math.round(e.t*10)/10,hr:e.hr!=null?Math.round(e.hr):null,hm:e.hm})):null;

const CART={id:null,corta:1};
const SIMB=[[19.20,77.67,8.20],[39.82,59.64,12.99],[69.18,33.94,19.82]]; // os três discos do símbolo (cx, cy, r num quadro de 100)
// trajeto da corrida; por padrão sem os 200 m do começo e do fim, para não mostrar onde a pessoa mora
function cartTrack(id,corta){
  const a=((AX[id]||{}).map||[]).filter(q=>q&&isFinite(q[0])&&isFinite(q[1]));if(a.length<2)return [];
  let t=a;
  if(corta){let i=0,d=0;while(i<a.length-1&&d<200){d+=dM(a[i],a[i+1]);i++}let j=a.length-1;d=0;while(j>i&&d<200){d+=dM(a[j],a[j-1]);j--}const c=a.slice(i,j+1);if(c.length>=3)t=c}
  const st=Math.max(1,Math.ceil(t.length/700));return t.filter((_,k)=>k%st===0||k===t.length-1);
}
const tempoCart=s=>{s=Math.round(s||0);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h?`${h}h ${pad(m)}min`:`${m}min ${pad(x)}s`};
// imagem com fundo transparente: três dados empilhados (nome em cima, número embaixo), o trajeto em azul e o símbolo branco no pé
function drawCart(cv){
  const a=D.acts.find(x=>x.id===CART.id);if(!a||!cv)return;
  const W=1080,H=1440,ctx=cv.getContext('2d'),F='-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif';
  cv.width=W;cv.height=H;ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='alphabetic';ctx.shadowColor='rgba(0,0,0,.35)';ctx.shadowBlur=12;
  const pace=a.dist?a.mov/a.dist*1000:null,dados=[['Distância',km(a.dist).replace('.',',')+' km'],['Ritmo',fmtP(pace)+' /km'],['Tempo',tempoCart(a.mov)]];
  dados.forEach(([l,v],i)=>{const y=150+i*215;ctx.font=`600 40px ${F}`;ctx.fillText(l,W/2,y);ctx.font=`800 100px ${F}`;ctx.fillText(v,W/2,y+108)});
  const tr=cartTrack(CART.id,CART.corta);
  if(tr.length>1){
    const la0=tr.reduce((s,q)=>s+q[0],0)/tr.length,cs=Math.cos(la0*Math.PI/180),P=tr.map(q=>[q[1]*cs,-q[0]]);
    const xs=P.map(p=>p[0]),ys=P.map(p=>p[1]),x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
    const top=790,bw=700,bh=430,sc=Math.min(bw/((x1-x0)||1e-9),bh/((y1-y0)||1e-9)),ox=(W-(x1-x0)*sc)/2,oy=top+(bh-(y1-y0)*sc)/2;
    ctx.shadowBlur=10;ctx.lineJoin='round';ctx.lineCap='round';ctx.strokeStyle='#4a9eff';ctx.lineWidth=11;
    ctx.beginPath();P.forEach((p,i)=>{const X=ox+(p[0]-x0)*sc,Y=oy+(p[1]-y0)*sc;i?ctx.lineTo(X,Y):ctx.moveTo(X,Y)});ctx.stroke();
  }
  // rodapé: nome StepOn e o símbolo à direita, os dois juntos e centralizados
  ctx.shadowBlur=8;ctx.fillStyle='#fff';ctx.textAlign='left';
  const nome='StepOn',fs=58,gap=20,sz=70;ctx.font=`800 ${fs}px ${F}`;
  const tw=ctx.measureText(nome).width,x0=(W-(tw+gap+sz))/2,base=1322,cy0=base-fs*0.36;
  ctx.fillText(nome,x0,base);
  const sx=x0+tw+gap,sy=cy0-sz/2;
  for(const [cx,cy,r] of SIMB){ctx.beginPath();ctx.arc(sx+cx/100*sz,sy+cy/100*sz,r/100*sz,0,Math.PI*2);ctx.fill()}
}

  const v=b64u(crypto.getRandomValues(new Uint8Array(48))),st=b64u(crypto.getRandomValues(new Uint8Array(16)));

async function trocaCodigo(body){
  try{const r=await fetch(OAUTH.token,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams(body)});
    return {ok:r.ok,status:r.status,j:await r.json().catch(()=>({}))}}
  catch(e){ // se o navegador bloquear a chamada direta, o servidor do app só repassa (não tem senha nenhuma)
    const r=await fetch(PUBURL+'/oauth/token',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});

/* ================= teste de 1 km ou 5 km: atualiza os ritmos ================= */
// quem tem plano gerado guarda o condicionamento no plano; quem tem plano próprio (como o Igor) guarda por 90 dias em 'vt'
const testesFeitos=()=>PF?(PF.tests||{}):LS.get('vtests',{});
// melhor trecho da corrida do dia do teste (ou nada, se o app ainda não analisou); ignora testes já aplicados
function testeAchado(){
  const hoje=ymd(TODAY()),T=testesFeitos();
  const p=plan().filter(x=>x.teste&&x.date<=hoje&&!(x.date in T)).pop();if(!p||!runsOn(p.date).length)return null;
  const d=p.teste===5000?5000:1000,ts=runsOn(p.date).map(a=>bestIn(a,d)).filter(Boolean);
  return {date:p.date,d,t:ts.length?Math.min(...ts):null};
}
// condicionamento novo pelo teste: se o anterior vinha do histórico real, não deixa pular mais de 5 pontos
function testeNovoV(t,d){const ant=curV()||32,V=vdot(d,t),hist=PF?PF.Vsrc==='historico':true;return Math.round((hist?clamp(V,ant-5,ant+5):V)*10)/10}
let TEST={ds:null,d:1000};
window.abrirTeste=(ds,t,d)=>{
  TEST={ds,d:d===5000?5000:1000};const k=TEST.d/1000;
  openSheet(`<div class="hd"><b>TESTE DE ${k} KM</b><button class="b sm" onclick="closeSheet()">✕</button></div>
  <p class="empty" style="color:var(--txt)">Informe quanto tempo você levou nos ${k} km em esforço máximo. O app recalcula o seu condicionamento e os ritmos dos treinos.</p>
  <label class="f">Tempo dos ${k} km (minutos:segundos)</label><input id="t-t" type="text" inputmode="numeric" placeholder="Ex.: ${k===1?'4:15':'25:30'}" value="${t?fmtT(t):''}" oninput="testePrev()">
  <div id="t-prev"></div>
  <button class="b pri full" id="t-ok" style="margin-top:12px" onclick="aplicaTeste()" disabled>Atualizar meus ritmos</button>
  <button class="b full" style="margin-top:8px" onclick="ignoraTeste()">Ignorar este teste</button>`);
  testePrev();
};
window.testePrev=()=>{
  const v=$('#t-t').value,t=parseT(v),d=TEST.d,lim=d===1000?[150,600]:[720,2400],ok=!!t&&t>=lim[0]&&t<=lim[1],b=$('#t-ok'),el=$('#t-prev');b.disabled=!ok;
  if(!ok){el.innerHTML=v?`<p class="empty bad" style="margin-top:8px">Tempo fora do esperado: use entre ${fmtT(lim[0])} e ${fmtT(lim[1])}.</p>`:'';return}
  const ant=curV()||32,V=testeNovoV(t,d),A=zonesFor(ant),B=zonesFor(V),f=z=>fmtP(z[0])+'–'+fmtP(z[1]);
  el.innerHTML=`<div class="card" style="margin-top:10px"><table><tr><th></th><th class="r">Antes</th><th class="r">Depois</th></tr>
  <tr><td style="font-family:var(--f)">Condicionamento (VDOT)</td><td class="r">${Math.round(ant*10)/10}</td><td class="r ok">${V}</td></tr>
  <tr><td style="font-family:var(--f)">Ritmo leve</td><td class="r">${f(A.E)}</td><td class="r ok">${f(B.E)}</td></tr>
  <tr><td style="font-family:var(--f)">Ritmo de limiar</td><td class="r">${f(A.T)}</td><td class="r ok">${f(B.T)}</td></tr>
  <tr><td style="font-family:var(--f)">Tiros fortes</td><td class="r">${f(A.I)}</td><td class="r ok">${f(B.I)}</td></tr></table></div><p class="empty" style="margin-top:8px">Os treinos depois deste teste passam a usar os ritmos novos, e as métricas (condicionamento, projeção de prova e ritmos de treino) também. Se o teste for pior, os ritmos ficam mais leves.</p>`;
};
window.aplicaTeste=()=>{
  const t=parseT($('#t-t').value),d=TEST.d,lim=d===1000?[150,600]:[720,2400];if(!(t>=lim[0]&&t<=lim[1]))return;
  const V=testeNovoV(t,d),Va=curV()||null;
  LS.set('vhist',[...vHist().filter(x=>x.ds!==TEST.ds),{ds:TEST.ds,V,Va,d,t:Math.round(t)}].sort((a,b)=>a.ds<b.ds?-1:1));
  if(PF){PF.V=V;PF.Vsrc='teste';PF.tests={...(PF.tests||{}),[TEST.ds]:Math.round(t)};LS.set('pf',PF)}
  else{LS.set('vt',{V,ds:TEST.ds});LS.set('vtests',{...LS.get('vtests',{}),[TEST.ds]:Math.round(t)})}
  closeSheet();toast('RITMOS ATUALIZADOS');render();
};
window.ignoraTeste=()=>{
  if(PF){PF.tests={...(PF.tests||{}),[TEST.ds]:0};LS.set('pf',PF)}else LS.set('vtests',{...LS.get('vtests',{}),[TEST.ds]:0});

function trimTrack(tr,full){
  if(!tr||tr.length<6)return null;let a=0,d=0;while(a<tr.length-1&&d<200){d+=dM(tr[a],tr[a+1]);a++}
  let b=tr.length-1;d=0;while(b>a&&d<200){d+=dM(tr[b],tr[b-1]);b--}
  const t=tr.slice(a,b+1);if(t.length<3)return null;if(full)return t;const st=Math.max(1,Math.ceil(t.length/80));
  return t.filter((_,i)=>i%st===0||i===t.length-1);
}

/* ---------- áreas dominadas ---------- */
const COR=['#4a9eff','#34c759','#ff5a5f','#ffb020','#b06cff','#ff6ec7','#19c9c0','#ff7a2f','#a3e635','#f43f5e'];
const corDe=(id,c)=>/^#[0-9a-f]{6}$/i.test(c||'')?c.toLowerCase():COR[[...String(id)].reduce((s,ch)=>s+ch.charCodeAt(0),0)%COR.length];
const minhaCor=()=>corDe(CFG.athlete,LS.get('cor',null));
// áreas fechadas por um trajeto [[lat,lng],…]: sempre que o caminho volta a menos de 30 m de um ponto por onde já passou (depois de pelo menos
// 300 m), o que ficou dentro vira uma área. A saída de casa, que não fecha nada, fica de fora. Voltas finas (ida e volta pela mesma rua) não contam.
function laços(tr){
  if(!tr||tr.length<8)return [];
  const la0=tr[0][0],lo0=tr[0][1],ky=111320,kx=111320*Math.cos(la0*Math.PI/180),P=tr.map(q=>[(q[1]-lo0)*kx,(q[0]-la0)*ky]);
  const PROX=30,MINP=300,MINA=8000,out=[],H=Math.hypot;
  const ap=(a,b,c)=>{const dx=c[0]-b[0],dy=c[1]-b[1],L=dx*dx+dy*dy,t=L?clamp(((a[0]-b[0])*dx+(a[1]-b[1])*dy)/L,0,1):0,x=b[0]+t*dx,y=b[1]+t*dy;return {d:H(a[0]-x,a[1]-y),x,y}};
  const area=r=>{let s=0;for(let i=0;i<r.length;i++){const a=r[i],b=r[(i+1)%r.length];s+=a[0]*b[1]-b[0]*a[1]}return Math.abs(s)/2};
  const per=r=>{let s=0;for(let i=0;i<r.length;i++){const a=r[i],b=r[(i+1)%r.length];s+=H(a[0]-b[0],a[1]-b[1])}return s};
  const ok=r=>{if(r.length<4)return false;const A=area(r),L=per(r);return A>=MINA&&A/(L*L)>=0.012};
  const volta=r=>out.push(r);
  let path=[P[0]],acc=[0];
  for(let i=1;i<P.length;i++){
    const b=P[i],last=path[path.length-1],ac=acc[acc.length-1]+H(b[0]-last[0],b[1]-last[1]);let hit=null;
    for(let k=0;k<path.length-1;k++){if(ac-acc[k+1]<MINP)break;const r=ap(b,path[k],path[k+1]);if(r.d<PROX){hit={k,x:r.x,y:r.y};break}}
    if(hit){const poly=[[hit.x,hit.y],...path.slice(hit.k+1),b];if(ok(poly))volta(poly);
      path=path.slice(0,hit.k+1);acc=acc.slice(0,hit.k+1);path.push([hit.x,hit.y]);acc.push(acc[hit.k]+H(hit.x-path[hit.k][0],hit.y-path[hit.k][1]))}
    else{path.push(b);acc.push(ac)}
  }
  // só conta o que o próprio trajeto fechou: começo e fim perto um do outro NÃO fecham nada sozinhos (ida e volta de casa não vira área)
  return out.map(r=>simp(r.map(q=>[la0+q[1]/ky,lo0+q[0]/kx]),140));
}
// simplifica o contorno (Douglas-Peucker) até caber em n pontos
function simp(pts,n){
  let tol=2;const dp=(a,tol)=>{if(a.length<3)return a;const A=a[0],B=a[a.length-1],cs=Math.cos(A[0]*Math.PI/180);let m=0,ix=0;

/* ================= níveis da conta: os pontos de cada temporada ficam guardados e sobem o nível =================
   pontos: 1 por km corrido e 3 por treino (a partir de 1 km).
   Os níveis 1 a 5 são Iniciante, 6 a 10 Intermediário e 11 em diante Avançado. A curva sobe devagar: o 1º nível vem na 1ª semana,
   o Intermediário em uns 4 meses de 3 treinos por semana, o Avançado em cerca de 1 ano de treino constante. */
const NIVT=L=>L<=1?0:Math.round(25*Math.pow(L-1,1.8)); // pontos acumulados para chegar ao nível L
const FAIXA=['Iniciante','Intermediário','Avançado'];
const nivelXp=xp=>{let L=1;while(NIVT(L+1)<=xp)L++;return {L,base:NIVT(L),prox:NIVT(L+1),faixa:L<=5?0:L<=10?1:2}};
function meuXp(){ // todas as corridas (também as marcadas à mão): 1 ponto por km e 3 por treino
  const runs=D.acts.filter(isRun),km=runs.reduce((s,r)=>s+(r.dist||0),0)/1000,tr=runs.filter(r=>(r.dist||0)>=1000).length;
  return Math.round(km+3*tr);
}
function xpDe(u){ // de outra pessoa: o total que o app dela mandou; se não mandou, o que dá para calcular do que ela publicou
  if(Number.isFinite(u.xp)&&u.xp>0)return u.xp;
  const r=u.runs||[],km=r.reduce((s,x)=>s+(x.dist||0),0)/1000,tr=r.filter(x=>(x.dist||0)>=1000).length;
  return Math.round(km+3*tr);
}
function checaNivel(){
  if(!D.acts||!D.acts.length)return;const N=nivelXp(meuXp()),v=LS.get('nivelVisto',null);
  if(v==null){LS.set('nivelVisto',N.L);return}
  if(N.L>v){LS.set('nivelVisto',N.L);toast(`🎉 VOCÊ SUBIU PARA O NÍVEL ${N.L} · ${FAIXA[N.faixa].toUpperCase()}`,4500)}
}
const nivelCard=()=>{const XP=meuXp(),N=nivelXp(XP),pct=Math.min(100,(XP-N.base)/((N.prox-N.base)||1)*100);

/* ================= gravar corrida (GPS do celular) ================= */
// para quem não tem relógio: grava pelo celular e manda ao Intervals como arquivo GPX (pausas viram trechos separados)
// pontos: [hora ms, lat, lon, altitude, trecho]
let REC=LS.get('rec',null),RM=null,RWID=null,RTK=null,WL=null,FIX=null,RSEL={p:null,modo:'livre'};
// diagnóstico do GPS de cada gravação: pontos válidos e descartados, maior tempo sem sinal, vezes que o app saiu da tela
const gNovo=()=>({ok:0,fraco:0,salto:0,rej:0,max:0,lp:0,hid:0,ocN:0,ocMs:0,ult:0,avisa:0,perdeu:0});
if(REC&&!REC.g)REC.g=gNovo();
const hav=(a,b)=>{const r=Math.PI/180,x=Math.sin((b[0]-a[0])*r/2)**2+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin((b[1]-a[1])*r/2)**2;return 12742000*Math.asin(Math.sqrt(x))};
const recLive=()=>!!REC&&REC.st!=='idle';
const recMov=()=>REC?(REC.mov+(REC.st==='run'?Date.now()-REC.since:0))/1000:0;
const recKeep=()=>LS.set('rec',REC);
const isoLocal=ms=>{const d=new Date(ms);return ymd(d)+'T'+pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds())};
const locMsg=()=>/iPhone|iPad/.test(navigator.userAgent)?'PERMITA A LOCALIZAÇÃO NOS AJUSTES DO IPHONE':'PERMITA A LOCALIZAÇÃO NO NAVEGADOR';
const say=t=>{if(!LS.get('voz',1)||!window.speechSynthesis)return;try{if(speechSynthesis.pending)speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='pt-BR';u.rate=1.05;speechSynthesis.speak(u)}catch(e){}};
const paceVoz=s=>{s=Math.round(s);return Math.floor(s/60)+(s%60?' e '+(s%60):' em ponto')};
async function wake(on){try{if(on&&!WL&&navigator.wakeLock){WL=await navigator.wakeLock.request('screen');WL.addEventListener('release',()=>{WL=null})}else if(!on&&WL){await WL.release();WL=null}}catch(e){}}
// o iPhone para o GPS de um app quando ele sai da tela: anota quanto tempo ficou fora
document.addEventListener('visibilitychange',()=>{
  if(!recLive())return;const g=REC.g;
  if(document.visibilityState==='hidden'){if(REC.st==='run'&&!g.hid){g.hid=Date.now();recKeep()}}
  else{wake(1);if(g.hid){const ms=Date.now()-g.hid;g.hid=0;if(ms>3000){g.ocN++;g.ocMs+=ms;g.ult=ms;g.avisa=Date.now()+25000;say('O app ficou fora da tela. O GPS pode ter parado.')}recKeep()}}
});
/* treino guiado: o plano do dia vira uma lista de etapas (com as repetições abertas) que o app vai cumprindo pela distância ou pelo tempo */
const nomeE=e=>({'Rec.':'Recuperação','Aquecer':'Aquecimento','Desaquecer':'Desaquecimento'}[e.nome]||e.nome);
const fmtN=x=>String(Math.round(x*10)/10).replace('.',',');
const qtd=(e,voz)=>e.m?(e.m>=1000?fmtN(e.m/1000)+(voz?(e.m===1000?' quilômetro':' quilômetros'):' km'):Math.round(e.m)+(voz?' metros':' m')):(e.s>=60?fmtN(e.s/60)+(voz?(e.s===60?' minuto':' minutos'):' min'):Math.round(e.s)+(voz?' segundos':' s'));
function flatSteps(p){
  const mk=(s,r,n)=>{const m=/^([\d.]+)(km|m|min|s)$/.exec(s[1])||[],v=parseFloat(m[1])||0,u=m[2];return {nome:s[0],r,n,m:u==='km'?v*1000:u==='m'?v:0,s:u==='min'?v*60:u==='s'?v:0,pace:s[2]||null}};
  const st=p.steps,out=[];let i=0;
  while(i<st.length){const s=st[i];
    if(s[3]&&st[i+1]&&st[i+1][3]===s[3]){for(let r=1;r<=s[3];r++){out.push(mk(s,r,s[3]));out.push(mk(st[i+1],r,s[3]))}i+=2}
    else if(s[3]){for(let r=1;r<=s[3];r++)out.push(mk(s,r,s[3]));i++}
    else{out.push(mk(s,0,0));i++}}
  return out.filter(e=>e.m>0||e.s>0);
}
function wkSay(){
  const w=REC&&REC.wk;if(!w)return;
  if(w.i>=w.steps.length)return say('Treino concluído. Pode desacelerar e finalizar quando quiser.');
  const e=w.steps[w.i];
  say(`${nomeE(e)}${e.n?' '+e.r+' de '+e.n:''}. ${qtd(e,1)}${e.pace&&e.r<=1?'. Ritmo '+paceVoz((e.pace[0]+e.pace[1])/2):''}`);
}
function wkNext(manual){
  const w=REC.wk,e=w.steps[w.i],now=recMov(),dd=REC.dist-w.d0,tt=now-w.t0;
  w.laps.push({nome:e.nome,r:e.r,n:e.n,dist:Math.round(!manual&&e.m?e.m:dd),t:Math.round(!manual&&e.s?e.s:tt)});
  // etapa por distância: a sobra de metros passa para a próxima; por tempo: a sobra de segundos
  if(manual){w.d0=REC.dist;w.t0=now}else if(e.m){w.d0+=e.m;w.t0=now}else{w.t0+=e.s;w.d0=REC.dist}
  w.i++;w.av=0;recKeep();wkSay();
}
function wkStep(){
  const w=REC&&REC.wk;if(!w||REC.st!=='run')return;
  for(let k=0;k<30&&w.i<w.steps.length;k++){
    const e=w.steps[w.i],dd=REC.dist-w.d0,tt=recMov()-w.t0;
    if(e.m?dd>=e.m:tt>=e.s){wkNext(false);continue}
    if(e.m>=500&&e.m-dd<=100&&!w.av){w.av=1;say('Faltam 100 metros')}
    break;
  }
}
window.recSkip=()=>{if(REC&&REC.wk&&REC.wk.i<REC.wk.steps.length&&REC.st==='run'){wkNext(true);recUI()}};

// parciais anteriores na tela de gravação: km a km na corrida livre, etapa a etapa no treino guiado (as 4 últimas + a atual)
function parHtml(t,d,done){
  const w=REC&&REC.wk,it=[];
  const nc=e=>({'Rec.':'Rec.','Aquecer':'Aquec.','Desaquecer':'Desaq.'}[e.nome]||e.nome)+(e.n?' '+e.r:'');
  const dTxt=m=>m>=1000?(m/1000).toFixed(m%1000?2:0).replace('.',',')+' km':Math.round(m)+' m';
  if(w){
    w.laps.forEach(l=>it.push({p:l.dist>=20?l.t/l.dist*1000:null,t:l.t,lb:nc(l),sub:l.dist>=20?dTxt(l.dist):fmtT(l.t)}));
    if(w.i<w.steps.length){const e=w.steps[w.i],dd=REC.dist-w.d0,tt=recMov()-w.t0;if(dd>=20||tt>=10)it.push({p:dd>=20?tt/dd*1000:null,t:tt,lb:nc(e),sub:'agora',cur:1})}
  }else{
    REC.splits.forEach((s,i)=>it.push({p:s,lb:'km '+(i+1)}));
    const kd=d%1000;if(kd>=50)it.push({p:(t-done)/kd*1000,lb:'km '+(REC.splits.length+1),sub:'agora',cur:1});
  }
  if(!it.length)return `<div class="rpar-v">${w?'As etapas aparecem aqui assim que cada uma terminar.':'As parciais aparecem aqui a cada quilômetro.'}</div>`;
  const vs=it.slice(-5),sp=vs.filter(x=>x.p&&x.p<1200).map(x=>1/x.p),mn=Math.min(...sp),mx=Math.max(...sp);
  const alt=x=>!x.p||x.p>=1200?24:Math.round(34+(mx>mn?(1/x.p-mn)/(mx-mn):1)*36);
  return `<div class="rpar-h">${w?'ETAPAS (RITMO /KM)':'PARCIAIS (/KM)'}</div><div class="rpar">${vs.map(x=>`<div class="rp${x.cur?' cur':''}"><b>${x.p&&x.p<1200?fmtP(x.p):fmtT(x.t)}</b><i style="height:${alt(x)}px"></i><span>${esc(x.lb)}</span><small>${x.sub||''}</small></div>`).join('')}</div>`;
}
function wkUI(){
  const el=$('#r-wk'),w=REC&&REC.wk;if(!el)return;
  $('#r-run').classList.toggle('wkon',!!w);
  if(!w){el.innerHTML='';return}
  if(w.i>=w.steps.length){el.innerHTML='<div class="etp"><div class="lbl ok">✓ TREINO CONCLUÍDO</div><p class="empty" style="margin-top:4px">Pode desacelerar e tocar em Finalizar quando quiser.</p></div>';return}
  const e=w.steps[w.i],nx=w.steps[w.i+1],dd=REC.dist-w.d0,tt=recMov()-w.t0,cp=curPace();
  const rem=e.m?Math.max(0,e.m-dd):Math.max(0,e.s-tt),prog=clamp(e.m?dd/e.m:tt/e.s,0,1);
  const remTxt=e.m?(rem>=1000?(rem/1000).toFixed(2).replace('.',',')+' km':Math.round(rem)+' m'):fmtT(rem);
  let alvo='Ritmo livre';
  if(e.pace){const lo=Math.min(...e.pace),hi=Math.max(...e.pace);alvo=`Meta ${fmtP(lo)}–${fmtP(hi)}/km`;

  // os mapas são refeitos com a paleta nova
  if(CM){CM.remove();CM=null;const c=$('#cmap');if(c)c.parentNode.innerHTML=''}
  if(RM){RM.remove();RM=null;$('#rec').innerHTML='';if($('#rec').classList.contains('on'))openRec()}
  render();
};
temaIcone();

/* ================= navegação ================= */
const TITLES={ini:'INÍCIO',cal:'CALENDÁRIO',des:'DESAFIOS',comp:'MAPA',mais:'MAIS',perf:'PERFIL'};
let VIEW='ini';
function go2(v){document.querySelectorAll('.view').forEach(e=>e.classList.toggle('on',e.id==='v-'+v));document.querySelectorAll('#tabbar button').forEach(b=>b.classList.toggle('on',b.dataset.v===v))}
function go(v){VIEW=v;go2(v);render()}
document.querySelectorAll('#tabbar button').forEach(b=>b.onclick=()=>go(b.dataset.v));
$('#menu').onclick=()=>go(VIEW==='mais'?'ini':'mais');
$('#sync').onclick=()=>sync(0);
// junta cada título de seção (.sec) com o conteúdo dele num bloco, para as colunas não cortarem uma seção ao meio
function groupBlocks(el){const K=[...el.children];if(!K.length||K[0].classList.contains('blk'))return;let b=null;
  for(const k of K){if(!b||k.classList.contains('sec')){b=document.createElement('div');b.className='blk';el.insertBefore(b,k)}b.appendChild(k)}}
function render(){render2();const sb=$('#sbox'),k=sb&&sb.dataset.blk;if(k&&$('#sheet').classList.contains('on')&&BLK[k])openBlk(k,1)}
function render2(){if(_desk===null)marcaDesk();
  const ob=needOB();document.body.classList.toggle('ob',ob);
  const fab=$('#recfab');fab.classList.toggle('on',!ob&&temConta()&&(VIEW==='ini'||recLive())&&!$('#rec').classList.contains('on'));fab.classList.toggle('live',recLive());
  if(ob){document.querySelectorAll('.view').forEach(e=>e.classList.toggle('on',e.id==='v-ini'));$('#ttl').textContent='BOAS-VINDAS';rOB();return}
  if(VIEW==='ini'||!$('#v-'+VIEW).classList.contains('on'))go2(VIEW);
  $('#ttl').textContent=TITLES[VIEW];
  $('#avimg').src=myPic();
  $('#avst').className=D.at&&Date.now()-D.at<864e5?'on':D.at?'off':'';
  ({ini:rIni,cal:rCal,des:rDes,comp:rComp,mais:rMais,perf:rPerf})[VIEW]();
  if(['ini','des','mais','perf'].includes(VIEW)&&!(VIEW==='ini'&&DESK()))groupBlocks($('#'+VIEW));
  drawMaps();
}
window.sync=sync;window.sendWatch=sendWatch;
if(!LS.get('vhist')){const vt=LS.get('vt');if(vt&&vt.V){const Va=(curVdot()||{}).v||null;LS.set('vhist',[{ds:vt.ds,V:vt.V,Va,d:1000,t:(LS.get('vtests',{})[vt.ds])||null}])}else if(PF&&PF.Vsrc==='teste'){const ks=Object.keys(PF.tests||{}).filter(k=>PF.tests[k]).sort(),k=ks[ks.length-1];if(k)LS.set('vhist',[{ds:k,V:PF.V,Va:null,d:1000,t:PF.tests[k]}])}}
if(isIgor()&&!LS.get('fix0711')){const ex=LS.get('extra',{}),b=baseTemplate().find(p=>p.date==='2026-11-08');
  if(b&&!ex['2026-11-07']){ex['2026-11-07']={...b,date:'2026-11-07'};if(!ex['2026-11-08'])ex['2026-11-08']={date:'2026-11-08',off:1};LS.set('extra',ex)}LS.set('fix0711',1)}
render();
voltaOAuth().then(v=>{if(!v&&temConta()){if(!D.at||Date.now()-D.at>5*60e3)sync(0);else rede(1)}});
// voltou para o app (aba ou tela do celular): sincroniza se passou de 5 min, senão só atualiza os amigos
document.addEventListener('visibilitychange',()=>{if(document.visibilityState!=='visible'||!temConta()||!D.at)return;if(Date.now()-D.at>5*60e3)sync(0);else rede()});
