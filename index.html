<title>StepOn</title>

<script>
// no iPhone aberto pela Tela de Início (barra de status transparente) a página recebe a altura da tela menos a barra de status,
// e sobra uma faixa preta embaixo; aqui o app ocupa a altura real da tela, em qualquer modelo e orientação
try{if(JSON.parse(localStorage.getItem('br.tema')||'"dark"')==='light')document.documentElement.dataset.theme='light'}catch(e){}
(function(){
  const fit=()=>{let h=innerHeight;
    if(navigator.standalone){const deitado=innerWidth>innerHeight,s=deitado?Math.min(screen.width,screen.height):Math.max(screen.width,screen.height);h=Math.max(h,s)}
    document.documentElement.style.setProperty('--app-h',h+'px')};
  fit();addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,300));
})();
</script>
<style>

const CX_SIG=new Set(['FC','VO2','GPS','CTL','ATL','TSB','VDOT','PR','ID','API','HIIT','RPE','LTHR','LGPD','OK','PKCE','GPX','PNG','VFC','IA','REM','HRV','SPO2','PDF','URL','QR','UTC','ICU']);

const cxCaps=w=>/[A-ZÀ-ÖØ-Þ]/.test(w)&&!/[a-zß-öø-ÿ]/.test(w);
function cx(s){
  if(!s||!/[A-ZÀ-ÖØ-Þ]{2}/.test(s))return s;
  const tk=s.split(/(\s+)/);let i=0;
  while(i<tk.length){
    if(!cxCaps(tk[i])){i++;continue}
    let j=i,forte=false;
    while(j<tk.length&&(cxCaps(tk[j])||!/[A-Za-zÀ-ÿ]/.test(tk[j]))){const w=tk[j].replace(/[^A-Za-zÀ-ÿ0-9.]/g,'');if(cxCaps(tk[j])&&w.replace(/[^A-Za-zÀ-ÿ]/g,'').length>=2&&!CX_SIG.has(w))forte=true;j++}
    if(forte)for(let k=i;k<j;k++){if(!cxCaps(tk[k]))continue;const core=tk[k].replace(/^[^A-Za-zÀ-ÿ0-9]+|[^A-Za-zÀ-ÿ0-9.]+$/g,'').replace(/\.$/,'');
      tk[k]=CX_SIG.has(core)?tk[k]:CX_NOM[core]?tk[k].replace(core,CX_NOM[core]):tk[k].toLowerCase()}
    i=j}
  let r=tk.join('').replace(/ \/\/ /g,' · ');
  r=r.replace(/(^|[.!?]\s+|\n)(\s*)([a-zà-ÿ])/g,(m,a,b,c)=>a+b+c.toUpperCase());
  return r;
}
function cxNo(n){

}

const BE=[[1000,'1 KM'],[3000,'3 KM'],[5000,'5 KM'],[10000,'10 KM'],[21097.5,'21 KM'],[30000,'30 KM'],[42195,'42 KM']];
async function analyzeRuns(full){

async function loadAX(id){
  const s=await api(`/activity/${id}/streams?types=time,distance,heartrate,velocity_smooth,altitude,latlng`);
  const f=k=>s.find(x=>x.type===k)||{},g=k=>f(k).data||[];
  AX[id]=analyze(g('time'),g('distance'),g('heartrate'),g('altitude'),f('latlng'));
}
function analyze(t,d,hr,alt,ll){
  const out={splits:[],best:{},dec:null,chart:null};
  if(!t.length||!d.length)return out;
  // saltos de GPS: trecho acima de 6,5 m/s (2:34/km) não conta distância
  const c=[d[0]||0];for(let i=1;i<d.length;i++){const dd=(d[i]||0)-(d[i-1]||0),dt=(t[i]-t[i-1])||1;c.push(c[i-1]+(dd>0&&dd/dt<=6.5?dd:0))}
  d=c;
  // pausas: intervalo acima de 30 s vira o tempo que levaria no ritmo anterior
  const tm=[0];for(let i=1;i<t.length;i++){const dt=t[i]-t[i-1],dd=d[i]-d[i-1];let e=dt;if(dt>30){const pt=i>1?t[i-1]-t[i-2]:0,v=pt>0&&pt<=30?(d[i-1]-d[i-2])/pt:3;e=dd>0?dd/clamp(v,1.5,6):0}tm.push(tm[i-1]+e)}
  t=tm;
  // parciais por km
  let k=1,i0=0,t0=t[0];
  for(let i=1;i<d.length;i++){
    if(d[i]>=k*1000){
      const f=(k*1000-d[i-1])/((d[i]-d[i-1])||1),tk=t[i-1]+f*(t[i]-t[i-1]);
      const h=hr.slice(i0,i+1).filter(Boolean),hv=h.length?Math.round(h.reduce((x,y)=>x+y,0)/h.length):null;
      const el=alt.length?Math.round(alt[i]-alt[i0]):null;
      out.splits.push({km:k,t:tk-t0,hr:hv,el});t0=tk;i0=i;k++;
    }
  }
  const rest=d[d.length-1]-(k-1)*1000;
  if(rest>100){const h=hr.slice(i0).filter(Boolean);out.splits.push({km:k-1+rest/1000,part:rest,t:t[t.length-1]-t0,hr:h.length?Math.round(h.reduce((x,y)=>x+y,0)/h.length):null,el:alt.length?Math.round(alt[alt.length-1]-alt[i0]):null})}
  // melhores esforços (janela deslizante)
  for(const [dist] of BE){
    if(d[d.length-1]<dist)continue;
    let j=0,best=Infinity;
    for(let i=0;i<d.length;i++){
      while(j<d.length&&d[j]-d[i]<dist)j++;
      if(j>=d.length)break;
      const f=(dist-(d[j-1]-d[i]))/((d[j]-d[j-1])||1),tt=(t[j-1]+f*(t[j]-t[j-1]))-t[i];
      if(tt>0&&tt<best)best=tt;
    }
    if(isFinite(best))out.best[dist]=Math.round(best);
  }
  // deriva cardíaca (ritmo/FC 1ª metade vs 2ª)
  if(hr.length===t.length){
    const mv=[];for(let i=1;i<t.length;i++){const dt=t[i]-t[i-1],dd=d[i]-d[i-1];if(dt>0&&dt<=10&&dd/dt>1.6&&hr[i])mv.push([dt,dd,hr[i]])}
    const tot=mv.reduce((s,x)=>s+x[0],0);
    if(tot>1200){let acc=0,h1=[0,0,0],h2=[0,0,0];for(const x of mv){const h=(acc+=x[0])<=tot/2?h1:h2;h[0]+=x[0];h[1]+=x[1];h[2]+=x[2]*x[0]}
      const e1=(h1[1]/h1[0])/(h1[2]/h1[0]),e2=(h2[1]/h2[0])/(h2[2]/h2[0]),dec=Math.round((e1-e2)/e1*1000)/10;if(Math.abs(dec)<=30)out.dec=dec}
  }
  // gráfico reduzido (até 120 pontos)
  const n=Math.max(1,Math.floor(t.length/180));const P=[],H=[],T=[];
  for(let i=n;i<t.length;i+=n){const dd=d[i]-d[i-n],tt=t[i]-t[i-n];P.push(dd>0?tt/dd*1000:null);H.push(hr[i]||null);T.push(Math.round(t[i]))}
  out.chart={p:P,h:H,t:T};
  // trajeto reduzido (até ~300 pontos); o Intervals manda a latitude em data e a longitude em data2
  if(ll&&ll.data&&ll.data2){const la=ll.data,lo=ll.data2,st=Math.max(1,Math.ceil(la.length/300)),tr=[];
    const ix=[];for(let i=0;i<la.length;i+=st)ix.push(i);if(ix[ix.length-1]!==la.length-1)ix.push(la.length-1);
    for(const i of ix){if(la[i]==null||lo[i]==null||(!la[i]&&!lo[i]))continue;const q=tr[tr.length-1];
      if(q&&Math.abs(la[i]-q[0])+Math.abs(lo[i]-q[1])>0.005)continue; // salto de GPS
      tr.push([+la[i].toFixed(5),+lo[i].toFixed(5)])}
    if(tr.length>1)out.map=tr}
  return out;
}

// carga do dia: HRSS do Intervals; sem ele, TRIMP de Banister pela FC média
function loadOf(a){
  if(a.load!=null)return a.load;
  if(a.hr&&a.mov){const r=clamp((a.hr-CFG.fcrep)/(CFG.fcmax-CFG.fcrep),0,1);return a.mov/60*r*0.64*Math.exp(1.92*r)}
  return 0;
}
function pmc(){ // CTL 42 d, ATL 7 d (EWMA), TSB = CTL − ATL do dia anterior
  const byDay={};for(const a of D.acts){const k=a.date.slice(0,10);byDay[k]=(byDay[k]||0)+loadOf(a)}
  const t=TODAY();let d=addD(t,-400),ctl=0,atl=0;const S=[];
  while(d<=t){const L=byDay[ymd(d)]||0;const tsb=ctl-atl;ctl+=(L-ctl)/42;atl+=(L-atl)/7;S.push({d:ymd(d),L,ctl,atl,tsb});d=addD(d,1)}
  return S;
}
// VDOT (Daniels & Gilbert)
function vdot(dist,sec){const m=sec/60,v=dist/m;const vo2=-4.6+0.182258*v+0.000104*v*v;const p=0.8+0.1894393*Math.exp(-0.012778*m)+0.2989558*Math.exp(-0.1932605*m);return vo2/p}
function predict(V,dist){let lo=dist/1000*120,hi=dist/1000*600;for(let i=0;i<50;i++){const mid=(lo+hi)/2;vdot(dist,mid)>V?lo=mid:hi=mid}return (lo+hi)/2}
function bests(days){
  const lim=days?ymd(addD(TODAY(),-days)):'0';const B={};
  for(const a of D.acts){if(!isRun(a)||a.date<lim||a.type==='TrailRun'||/trilha|trail/i.test(a.name||''))continue;const x=AX[a.id];if(!x||!x.best)continue;
    for(const k in x.best){if(!B[k]||x.best[k]<B[k].t)B[k]={t:x.best[k],id:a.id,date:a.date}}
    // corrida com a distância exata: vale o tempo em movimento (sem as paradas)
    for(const [dist] of BE){if(a.dist>=dist*0.99&&a.dist<=dist*1.05&&a.mov){const tt=Math.round(a.mov*dist/a.dist);if(!B[dist]||tt<B[dist].t)B[dist]={t:tt,id:a.id,date:a.date}}}}
  return B;
}
function curVdot(){const B=bests(90);let best=null;for(const k in B){const dist=+k;if(dist<1500)continue;const v=vdot(dist,B[k].t);if(!best||v>best.v)best={v,dist,t:B[k].t}}return best}
function paceZones(V){ // ritmos de treino a partir do VDOT (% do VO2 máx)
  const vv=(v)=>{let lo=100,hi=500;for(let i=0;i<40;i++){const mid=(lo+hi)/2;(-4.6+0.182258*mid+0.000104*mid*mid)<v?lo=mid:hi=mid}return lo};
  const p=f=>60000/vv(V*f);
  return {E:[p(0.74),p(0.65)],M:[p(0.84),p(0.80)],T:[p(0.88),p(0.86)],I:[p(1.0),p(0.97)],R:[p(1.10),p(1.05)]};
}

function readiness(dt){
  const ds=ymd(dt),w=W(ds)||{},S=pmc(),p=S.find(x=>x.d===ds)||S[S.length-1];
  const base=D.well.filter(x=>x.d<ds&&x.d>=ymd(addD(dt,-28))&&x.rhr).map(x=>x.rhr);
  const rb=base.length?base.reduce((a,b)=>a+b,0)/base.length:null;
  let sc=0,parts=[];
  const sl=w.sleep;const sp=sl?40*clamp(sl/(7.5*3600),0,1):24;sc+=sp;parts.push(['SONO',sl?fmtSleep(sl):'--',sp/40]);
  let rp=22;if(w.rhr&&rb){const dl=w.rhr-rb;rp=30-clamp(dl,0,6)*5}sc+=rp;parts.push(['FC REPOUSO',w.rhr?w.rhr+(rb?(w.rhr-rb>=0?' (+':' (')+(w.rhr-rb).toFixed(0)+')':''):'--',rp/30]);
  const tp=30*clamp((p.tsb+30)/20,0,1);sc+=tp;parts.push(['EQUILÍBRIO',(Math.round(p.tsb*10)/10||0).toFixed(1),tp/30]);
  const ck=LS.get('ck',{})[ds];if(ck){sc+=(ck-3)*4}
  sc=Math.round(clamp(sc,0,100));
  return {sc,parts,st:gen(sc>=75?'ÓTIMO':sc>=50?'BOM':'BAIXO'),cls:sc>=75?'ok':sc>=50?'warn':'bad',w,rb,p};
}

const daCodigo=(S,Z)=>S.map(([et,v,u,z,r])=>{const a=[et,String(v)+u,z?Z[z]:null];if(r>1)a[3]=r;a[4]=z;return a});
function sessaoLib(id,P,Z){const L=LIBT[id],steps=daCodigo(L.s(P),Z);return {tipo:'qualidade',titulo:L.t(P),km:r5(steps.reduce((t,s)=>t+stepKm(s),0))||1,steps,dica:L.dica,...(L.teste?{teste:L.teste}:{})}}
// reduz o treino até caber no volume da semana (ou até a metade, na semana de alívio)
function libFit(id,P,Z,qmax,alivio){
  let cur=P,s=sessaoLib(id,cur,Z);const cheio=s.km;
  for(let i=0;i<12;i++){const nx=LIBT[id].red(cur,alivio);if(!nx||(alivio?s.km<=cheio*0.65:s.km<=qmax))break;cur=nx;s=sessaoLib(id,cur,Z)}
  return s;
}
// quem ainda não corre começa no corre e caminha: [minutos correndo, minutos caminhando]
const RW=[[1,2],[2,2],[3,2],[5,1],[8,1]];
function genPlan(pf){
  const Z=zonesFor(pf.V),E=Z.E,M=META[pf.meta]||META.c,novo=!pf.km0,P=[];
  const dias=[...pf.dias].sort((a,b)=>(a+6)%7-(b+6)%7),outros=dias.filter(d=>d!==pf.longo),k=outros.length;
  // se já passaram todos os dias de treino da semana de início, a semana 1 é a seguinte
  const ini=parseD(pf.inicio),N=M.sem+(novo&&M.d>=10?RW.length:0),m0=addD(monday(ini),(ini.getDay()+6)%7>(dias[dias.length-1]+6)%7?7:0);
  let W=Math.max(pf.km0,dias.length*3),L=Math.max(3,pf.L0||0);
  const niv=nivelDe(pf),lad=LADDER[niv];let li=0,lu=0,wT=-99; // degrau atual e quantas semanas já repetiu; semana do último teste
  const capL=M.d?Math.max(L,M.d>21?19:M.d+1):L+3,pico=Math.min(M.d?Math.max(W,{5:20,10:30,21:45}[pf.meta]):W*1.3,Math.max(W,capL+k*9));
  for(let w=0;w<N;w++){
    const add=(d,o)=>{const ds=ymd(addD(m0,7*w+(d+6)%7));if(ds>=pf.inicio)P.push({date:ds,...o})};
    if(M.d&&w===N-1){ // semana da prova: só rodagens curtas antes do dia D
      outros.filter(d=>(d+1)%7!==pf.longo).forEach(d=>add(d,{tipo:'rodagem',titulo:'Rodagem curta',km:3,steps:[['Contínuo','3km',E]]}));
      const rp=Math.round(predict(pf.V,M.dist)/M.d);
      add(pf.longo,{tipo:'prova',titulo:'DIA D: '+M.n,km:M.d,steps:[['Contínuo',M.d+'km',[rp,rp+15]]]});
      break;
    }
    if(novo&&w<RW.length){const [c,cw]=RW[w];
      dias.forEach(d=>{const lg=d===pf.longo,rp=Math.round(30/(c+cw))+(lg?1:0);add(d,{tipo:lg?'longo':'rodagem',titulo:`Corre ${c} min, caminha ${cw} (${rp}×)`,km:r5(rp*(c*60/E[1]+cw/10)),steps:[['Corre',c+'min',E,rp],['Caminhada',cw+'min',null,rp]]})});
      if(w===RW.length-1){W=dias.length*3;L=4}
      continue;
    }
    const dl=w>0&&(w+1)%4===0,Wk=dl?W*0.8:W,Lk=r5(dl?Math.max(3,L-2):L),resto=Math.max(0,Wk-Lk);
    let qs=null;
    if(k){
      const q=r5(clamp(resto/k*1.15,3,10)),qmax=Math.max(4.5,q*1.5),vale=ymd(addD(m0,7*w+(outros[0]+6)%7))>=pf.inicio;
      if(vale&&(wT<0||(w-wT>=8&&w<N-3))){ // teste de 1 km na 1ª semana possível e de novo a cada 8 semanas
        wT=w;qs=sessaoLib('teste1k',niv?{a:2,d:2}:{a:1.5,d:1.5},Z)}
      else{
        const [id,P0]=lad[Math.min(li,lad.length-1)];
        qs=libFit(id,id==='acel'?{c:r5(clamp(q-1,2,6))}:P0,Z,qmax,dl);
        if(dl)qs.titulo+=' (alívio)';else if(vale&&++lu>=2){lu=0;li++}}
    }
    const e=k>1?r5(clamp((resto-qs.km)/(k-1),3,10)):0;
    add(pf.longo,{tipo:'longo',titulo:'Longão '+kmTxt(Lk)+' km',km:Lk,steps:[['Contínuo',Lk+'km',E]]});
    outros.forEach((d,i)=>add(d,i===0?qs:{tipo:'rodagem',titulo:'Rodagem leve',km:e,steps:[['Contínuo',e+'km',E]]}));
    if(!dl){W=Math.min(W*1.08,pico);L=Math.min(L+(M.d>21?1.5:1),capL)}
  }
  return P;
}
const baseTemplate=()=>PF?genPlan(PF):isIgor()?planIgor():[];
// treinos criados ou editados à mão ficam em 'extra' e substituem o do dia ({off:1} = dia sem treino)
let _pk='',_pv=[];
function plan(){
  const ov=LS.get('ov',{}),ex=LS.get('extra',{}),key=CFG.athlete+JSON.stringify(PF)+JSON.stringify(ov)+JSON.stringify(ex);
  if(key===_pk)return _pv;
  _pv=baseTemplate().filter(p=>!ex[p.date]).concat(Object.values(ex).filter(x=>!x.off)).map(p=>ov[p.date]?{...p,...ov[p.date]}:p).sort((a,b)=>a.date<b.date?-1:1);
  _pk=key;return _pv;
}
const planOn=ds=>plan().find(p=>p.date===ds);
const evOn=ds=>(D.ev||[]).find(e=>e.d===ds);

function status(p){
  const ex=runsOn(p.date),km_=ex.reduce((s,a)=>s+(a.dist||0),0)/1000;
  if(ex.length)return km_>=p.km*0.8?'cumprido':'parcial';
  if(p.date<ymd(TODAY()))return 'perdido';

// ajuste adaptativo: proposta do Coach quando a prontidão está baixa
function adjust(p,r){
  if(!p||p.adjusted||p.date!==ymd(TODAY()))return null;
  if(r.sc<50&&p.tipo!=='rodagem')return {why:`Disposição ${r.sc}/100. Treino de qualidade trocado por rodagem regenerativa para não acumular fadiga.`,new:{tipo:'rodagem',titulo:'Regenerativo (ajuste do Coach)',km:Math.max(3,Math.round(p.km*0.6)),steps:[['Contínuo',Math.max(3,Math.round(p.km*0.6))+'km',[390,420]]],adjusted:1}};
  if(r.sc<65&&(p.tipo==='longo'||p.tipo==='qualidade')){const k=Math.round(p.km*0.8);return {why:`Disposição ${r.sc}/100. Volume reduzido em 20% e ritmo mais solto.`,new:{km:k,titulo:p.titulo+' (−20%)',steps:p.steps.map(s=>[s[0],s[1].endsWith('km')&&s[3]==null?Math.max(1,Math.round(parseFloat(s[1])*0.8))+'km':s[1],s[2]&&[s[2][0]+10,s[2][1]+10],s[3]?Math.max(1,s[3]-1):undefined]),adjusted:1}}}
  return null;
}
// texto no formato de treino do Intervals.icu (vai para o Garmin)
function toIcu(p){
  const pz=r=>r?(fmtP(Math.min(...r))+'-'+fmtP(Math.max(...r))+'/km Pace'):'Z1 HR';
  // no Intervals "m" é minuto e metro é "mtr"
  const du=x=>/min$/.test(x)?x.replace(/min$/,'m'):/\dm$/.test(x)?x.replace(/m$/,'mtr'):x;
  let out='',i=0;const st=p.steps.map(s=>{const c=[...s];c[1]=du(s[1]);return c});
  while(i<st.length){
    const s=st[i];
    if(s[3]&&st[i+1]&&st[i+1][3]===s[3]){out+=`\n${s[3]}x\n- ${s[1]} ${pz(s[2])}\n- ${st[i+1][1]} ${pz(st[i+1][2])}\n`;i+=2}
    else if(s[3]){out+=`\n${s[3]}x\n- ${s[1]} ${pz(s[2])}\n`;i++}
    else{out+=`\n${s[0]}\n- ${s[1]} ${pz(s[2])}\n`;i++}
  }
  return out.trim();
}
async function sendWatch(ds){
  const p=planOn(ds);if(!p)return;
  if(!confirm(`${evOn(ds)?'Atualizar':'Enviar'} "${p.titulo}" (${ds.split('-').reverse().join('/')}) no calendário do Intervals.icu?\n\nO Intervals repassa ao Garmin Connect, e o relógio recebe na próxima sincronização.`))return;
  try{
    const old=evOn(ds),body=JSON.stringify({category:'WORKOUT',type:'Run',start_date_local:ds+'T00:00:00',name:p.titulo,description:toIcu(p)});
    const ev=old?await api(`/athlete/${CFG.athlete}/events/${old.id}`,{method:'PUT',body}):await api(`/athlete/${CFG.athlete}/events`,{method:'POST',body});
    D.ev=(D.ev||[]).filter(e=>e.d!==ds).concat([{id:ev.id,d:ds,name:ev.name}]);LS.set('data',D);
    toast(D.athlete&&D.athlete.gUp?'TREINO ENVIADO AO RELÓGIO':'ENVIADA AO INTERVALS // LIGUE O ENVIO AO GARMIN',3500);render();
  }catch(e){toast('FALHA NO ENVIO // '+e.message,3500)}
}

/* ================= Coach (regras; Claude entra na fase 2) ================= */
function coachLast(a){
  const x=AX[a.id]||{},p=planOn(a.date.slice(0,10)),pace=a.mov&&a.dist?a.mov/a.dist*1000:null;
  const z=D.athlete&&D.athlete.run&&D.athlete.run.hr_zones||[148,157,166,175,180,185,194];
  const msg=[];
  // sessão intervalada: ritmo muito variável (coef. de variação > 25%) ou plano de qualidade
  const pv=(x.chart&&x.chart.p||[]).filter(v=>v&&v<900),mu=pv.reduce((s,v)=>s+v,0)/(pv.length||1);
  const cv=pv.length?Math.sqrt(pv.reduce((s,v)=>s+(v-mu)**2,0)/pv.length)/mu:0;
  const fast=[...pv].sort((m,n)=>m-n).slice(0,Math.max(1,Math.round(pv.length*0.15))),fm=fast.length?fast.reduce((s,v)=>s+v,0)/fast.length:0;
  const inter=p?.tipo==='qualidade'||/tiro|interval/i.test(a.name||'')||(cv>0.25&&fm&&fm<330);
  if(inter){
    msg.push(`Sessão intervalada. Trechos rápidos em torno de ${fmtP(fm)}/km, FC máxima ${a.hrmax||'--'} bpm.`);
    if(a.hrmax&&a.hrmax>=CFG.fcmax*0.95)msg.push('Chegou perto da FC máxima: estímulo forte, próximo treino deve ser leve.');
    return (p?`Planejado: ${p.titulo}. `:'')+msg.join(' ');
  }
  if(p){const r=a.dist/1000/p.km;msg.push(r>=0.95?`Treino cumprido: ${km(a.dist)} de ${p.km} km planejados.`:r>=0.8?`Volume quase completo (${Math.round(r*100)}% do planejado).`:`Volume abaixo do planejado (${Math.round(r*100)}%). Sem problema na fase de retorno; não compensar no próximo treino.`)}
  if(a.hr){const zi=z.findIndex(v=>a.hr<=v)+1;msg.push(`FC média ${a.hr} bpm (Z${zi||7})${zi<=2?': esforço aeróbico, base sendo construída.':zi<=4?': sessão moderada a forte.':': sessão intensa, priorizar recuperação.'}`)}
  if(x.dec!=null&&!p?.tipo?.match(/qualidade/))msg.push(x.dec<=5?`Deriva cardíaca ${x.dec}%: boa resistência aeróbica para esta duração.`:`Deriva cardíaca ${x.dec}%: a FC subiu no fim. Sinal de base aeróbica ainda curta; manter rodagens leves.`);
  if(x.splits&&x.splits.length>=3){const s=x.splits.filter(s=>!s.part);if(s.length>=3){const f=s[0].t,l=s[s.length-1].t;msg.push(l<f-5?'Parciais em progressão negativa: boa disciplina de ritmo.':l>f+15?'Ritmo caiu no fim; segurar mais o início.':'Ritmo estável do começo ao fim.')}}
  if(!msg.length&&pace)msg.push(`Ritmo médio ${fmtP(pace)}/km.`);
  return msg.join(' ');
}

  highway_path:'#eef2f5',highway_minor:'#f7f9fb',highway_major_casing:'#bfcad4',highway_major_inner:'#ffffff',highway_major_subtle:'#ffffff',
  highway_motorway_casing:'#aebbc7',highway_motorway_inner:'#ffffff',highway_motorway_subtle:'#ffffff',railway:'#c1cbd4',railway_minor:'#c1cbd4',railway_transit:'#c1cbd4'};
const TEMA=()=>document.documentElement.dataset.theme==='light'?'light':'dark';
const TM={dark:{cor:MCOR,txt:'#6b727c',halo:'#000',verde:'#0b1d11',parque:'#0e2416',sob:'#000'},light:{cor:MCORL,txt:'#5f6b77',halo:'#eef2f5',verde:'#cddfcd',parque:'#c3d8c3',sob:'#ffffff'}};
let _mlj=null;
function mlLoad(){
  const t=TEMA(),T=TM[t];_ml=_ml||{};
  if(_ml[t])return _ml[t];
  _mlj=_mlj||new Promise((ok,er)=>{const c=document.createElement('link');c.rel='stylesheet';c.href=ML+'.css';document.head.appendChild(c);
    const s=document.createElement('script');s.src=ML+'.js';s.onload=ok;s.onerror=er;document.head.appendChild(s)}).catch(e=>{_mlj=null;throw e});
  return _ml[t]=_mlj.then(()=>fetch('https://tiles.openfreemap.org/styles/dark')).then(r=>r.json()).then(st=>{
      for(const l of st.layers){const c=T.cor[l.id],pt=l.paint=l.paint||{},k=l.type==='background'?'background-color':l.type==='fill'?'fill-color':l.type==='line'?'line-color':null;
        if(c&&k)pt[k]=c;else if(t==='light'&&k)pt[k]=l.type==='line'?'#c9d2da':'#dfe6ec';
        if(t==='light'&&pt['fill-outline-color'])pt['fill-outline-color']='#c3ccd5'; // contorno escuro dos prédios
        if(l.type==='symbol'&&pt['text-color'])pt['text-color']=T.txt,pt['text-halo-color']=T.halo}
      // verde discreto para parques, praças, gramados e matas (o estilo original não pinta a área dos parques)
      const wd=st.layers.find(l=>l.id==='landcover_wood');if(wd){delete wd.paint['fill-pattern'];wd.paint['fill-opacity']=.85}
      const at=st.layers.findIndex(l=>l.id==='building');
      st.layers.splice(at<0?1:at,0,
        {id:'bn_verde',type:'fill',source:'openmaptiles','source-layer':'landcover',filter:['match',['get','class'],['grass','wood'],true,false],paint:{'fill-color':T.verde,'fill-opacity':.85}},
        {id:'bn_parque',type:'fill',source:'openmaptiles','source-layer':'park',paint:{'fill-color':T.parque,'fill-opacity':.9}});
      return st}).catch(e=>{_ml[t]=null;throw e});
}
const mapBox=(id,H)=>{const im=(MAPIMG[id+'_'+H+TEMA()]||{}).src;return `<div class="map" data-map="${id}" data-h="${H}" style="height:${H}px">${im?`<img class="mimg" src="${im}" alt="">`:''}<span>© OpenFreeMap · OpenStreetMap</span></div>`};
function drawMaps(){
  document.querySelectorAll('.map[data-map]:not(.ok)').forEach(async el=>{
    // só tira a foto do mapa com o cartão visível e no tamanho certo; escondido (outra aba) tenta de novo depois
    const W=el.clientWidth;if(W<40)return;
    el.classList.add('ok');const id=el.dataset.map,key=id+'_'+el.dataset.h+TEMA(),tr=(AX[id]||{}).map;
    if(!tr||(MAPIMG[key]&&Math.abs(MAPIMG[key].w-W)<=4))return;
    el.querySelectorAll('.mimg').forEach(x=>x.remove());
    try{
      const st=await mlLoad(),box=document.createElement('div');box.style.cssText='position:absolute;inset:0';el.prepend(box);
      const ll=tr.map(p=>[p[1],p[0]]),b=ll.reduce((b,p)=>b.extend(p),new maplibregl.LngLatBounds(ll[0],ll[0]));
      const m=new maplibregl.Map({container:box,style:structuredClone(st),interactive:false,pitch:0,bearing:0,maxPitch:0,attributionControl:false,preserveDrawingBuffer:true,fadeDuration:0,bounds:b,fitBoundsOptions:{padding:{top:24,bottom:24,left:28,right:28},maxZoom:17}});
      m.on('load',()=>{
        m.addSource('rt',{type:'geojson',data:{type:'Feature',geometry:{type:'LineString',coordinates:ll}}});
        m.addSource('pt',{type:'geojson',data:{type:'FeatureCollection',features:[ll[0],ll[ll.length-1]].map((c,i)=>({type:'Feature',properties:{f:i},geometry:{type:'Point',coordinates:c}}))}});
        const lay={'line-join':'round','line-cap':'round'};
        m.addLayer({id:'rt0',type:'line',source:'rt',layout:lay,paint:{'line-color':TM[TEMA()].sob,'line-opacity':.6,'line-width':7}});
        m.addLayer({id:'rt1',type:'line',source:'rt',layout:lay,paint:{'line-color':'#4a9eff','line-width':3.5}});
        m.addLayer({id:'pt',type:'circle',source:'pt',paint:{'circle-radius':5,'circle-color':['case',['==',['get','f'],0],'#fff','#4a9eff'],'circle-stroke-width':2.5,'circle-stroke-color':['case',['==',['get','f'],0],'#4a9eff','#fff']}});
        m.once('idle',()=>{MAPIMG[key]={src:m.getCanvas().toDataURL('image/png'),w:W};m.remove();box.remove();
          if(!el.isConnected)return;const im=new Image();im.className='mimg';im.alt='';im.src=MAPIMG[key].src;el.prepend(im)});
      });
    }catch(e){el.classList.add('err')}
  });
}
function ringSvg(v,cls){const c=2*Math.PI*36,col=cls==='ok'?'var(--blue)':cls==='warn'?'var(--amber)':'var(--red)';return `<svg viewBox="0 0 86 86"><circle cx="43" cy="43" r="36" style="stroke:var(--track)" stroke-width="7" fill="none"/><circle cx="43" cy="43" r="36" stroke="${col}" stroke-width="7" fill="none" stroke-dasharray="${c*v/100} ${c}" transform="rotate(-90 43 43)"/><text x="43" y="49" text-anchor="middle" style="fill:var(--hi)" font-family="ui-monospace,Menlo,monospace" font-size="20" font-weight="700">${v}</text></svg>`}
function pmcSvg(S,days=90){
  S=S.slice(-days);const w=600,h=120,mx=Math.max(10,...S.map(s=>Math.max(s.ctl,s.atl))),mn=Math.min(-10,...S.map(s=>s.tsb));
  const y=v=>h-8-(v-mn)/(mx-mn)*(h-16),x=i=>i/(S.length-1)*w;
  const line=(k,c,dash)=>`<polyline fill="none" stroke="${c}" stroke-width="1.6" ${dash?'stroke-dasharray="3 3"':''} points="${S.map((s,i)=>x(i).toFixed(1)+','+y(s[k]).toFixed(1)).join(' ')}"/>`;
  return `<svg class="ch" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="height:120px"><line x1="0" x2="${w}" y1="${y(0)}" y2="${y(0)}" stroke="#252a31"/>${line('ctl','#4a9eff')}${line('atl','#e0442f')}${line('tsb','#c9a24a',1)}</svg>
  <div class="row meta" style="gap:14px;margin-top:4px"><span><span style="color:var(--blue)">━</span> Forma</span><span><span style="color:var(--red)">━</span> Fadiga</span><span><span style="color:var(--amber)">┅</span> Equilíbrio</span></div>`;
}

function metas(){

const parseT=s=>{const p=String(s||'').trim().split(':').map(Number);if(!s||p.some(isNaN))return null;return p.length===3?p[0]*3600+p[1]*60+p[2]:p.length===2?p[0]*60+p[1]:p[0]*60};

function metaTxt(m){
  if(m.txt)return m.txt;

}
function bestIn(a,dist){
  let b=(AX[a.id]&&AX[a.id].best||{})[dist]||null;
  if(a.dist>=dist*0.99&&a.dist<=dist*1.05&&a.mov){const tt=Math.round(a.mov*dist/a.dist);if(!b||tt<b)b=tt}
  return b;
}
function metaStatus(m){
  const hoje=ymd(TODAY()),dias=Math.round((parseD(m.fim)-TODAY())/864e5),janela=D.acts.filter(a=>isRun(a)&&a.date.slice(0,10)>=m.ini&&a.date.slice(0,10)<=m.fim);
  if(m.tipo==='volume'){const tot=janela.reduce((s,a)=>s+(a.dist||0),0);return {ok:tot>=m.dist,tot,prog:tot/m.dist,dias,fora:hoje>m.fim,antes:hoje<m.ini}}
  const maior=Math.max(0,...janela.map(a=>a.dist||0));
  const runs=janela.filter(a=>a.dist>=m.dist*0.99);
  let best=null;for(const a of runs){const t=bestIn(a,m.dist)||a.mov;if(t&&(!best||t<best.t))best={t,a}}
  return {ok:!!best&&(!m.tempo||best.t<=m.tempo),best,prog:best?(m.tempo?Math.min(1,m.tempo/best.t):1):maior/m.dist,maior,dias,fora:hoje>m.fim,antes:hoje<m.ini};
}

function rotaSvg(pts,W,H){
  const P=(pts||[]).filter(q=>q&&isFinite(q[0])&&isFinite(q[1]));if(P.length<2)return '';

  const d=Q.map((q,i)=>(i?'L':'M')+(ox+(q[0]-x0)*sc).toFixed(1)+' '+(oy+(q[1]-y0)*sc).toFixed(1)).join('');
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet"><path d="${d}" fill="none" stroke="#4a9eff" stroke-width="${Math.max(3,W/90)}" stroke-linejoin="round" stroke-linecap="round"/></svg>`;

/* ================= etapas (voltas) do relógio: lê o arquivo original .fit da corrida ================= */
// formato FIT da Garmin: cabeçalho, mensagens de definição e de dados; só as voltas (mensagem 19) interessam
function fitLaps(buf){
  const dv=new DataView(buf),u8=new Uint8Array(buf);
  if(buf.byteLength<14||String.fromCharCode(u8[8],u8[9],u8[10],u8[11])!=='.FIT')return null;
  const hs=u8[0],end=Math.min(buf.byteLength,hs+dv.getUint32(4,true)),defs={},laps=[];let p=hs;
  const INV={1:127,2:255,3:32767,4:65535,5:2147483647,6:4294967295,0:255,13:255};
  const rd=(o,sz,t,le)=>{let v;
    switch(t){case 1:v=dv.getInt8(o);break;case 3:v=dv.getInt16(o,le);break;case 4:case 11:v=dv.getUint16(o,le);break;case 5:v=dv.getInt32(o,le);break;case 6:case 12:v=dv.getUint32(o,le);break;case 0:case 2:case 10:case 13:v=dv.getUint8(o);break;default:return null}
    return INV[t]===v?null:v};
  try{
    while(p<end){
      const h0=u8[p++];
      if(h0&0x80){const d=defs[(h0>>5)&3];if(!d)return null;p+=d.size;continue}
      const lt=h0&0x0f;
      if(h0&0x40){p++;const le=u8[p++]===0,gn=dv.getUint16(p,le);p+=2;const nf=u8[p++],f=[];let size=0;
        for(let i=0;i<nf;i++){f.push([u8[p],u8[p+1],u8[p+2]&0x1f]);size+=u8[p+1];p+=3}
        if(h0&0x20){const nd=u8[p++];for(let i=0;i<nd;i++){size+=u8[p+1];p+=3}} // campos de desenvolvedor
        defs[lt]={gn,le,f,size}}
      else{const d=defs[lt];if(!d)return null;
        if(d.gn===19){let o=p;const m={};for(const [n,sz,t] of d.f){if(n===7||n===8||n===9||n===15||n===16||n===24||n===71){const sizes={0:1,1:1,2:1,3:2,4:2,5:4,6:4,10:1,11:2,12:4,13:1};if(sizes[t]===sz)m[n]=rd(o,sz,t,d.le)}o+=sz}
          laps.push({t:m[8]!=null?m[8]/1000:null,d:m[9]!=null?m[9]/100:null,hr:m[15],hm:m[16],trig:m[24],idx:m[71]})}
        p+=d.size}
    }
  }catch(e){return null}
  return laps.length?laps:null;
}
// junta voltas seguidas do mesmo passo do treino (o aquecimento de 1,5 km vem em duas voltas: 1 km + 0,5 km)
function mergeLaps(L){
  const V=L.filter(l=>l.t&&l.d);
  // corrida livre com voltas automáticas de 1 km (e a última volta encerrada ao parar o relógio): não é treino por etapas
  if(!V.some(l=>l.idx!=null)&&!V.some((l,i)=>l.trig===0&&l.d>=100&&i<V.length-1))return null;
  const out=[];
  V.forEach((l,i)=>{
    const p=out[out.length-1],ult=i===V.length-1;
    if(p&&((l.idx!=null&&l.idx===p.idx)||(ult&&l.idx==null&&l.d<100))){
      if(l.hr!=null)p.hr=p.hr!=null?(p.hr*p.t+l.hr*l.t)/(p.t+l.t):l.hr;
      p.hm=Math.max(p.hm||0,l.hm||0)||null;p.d+=l.d;p.t+=l.t}
    else out.push({idx:l.idx,d:l.d,t:l.t,hr:l.hr,hm:l.hm});
  });
  return out.length>=2?out.map(e=>({idx:e.idx,d:Math.round(e.d),t:Math.round(e.t*10)/10,hr:e.hr!=null?Math.round(e.hr):null,hm:e.hm})):null;
}
async function loadEtapas(id){
  const x=AX[id];if(!x||!temConta())return;
  try{
    const r=await fetch(`${API}/activity/${id}/file`,{headers:{Authorization:authH()}});
    if(r.ok){const L=fitLaps(await r.arrayBuffer());x.etapas=L?mergeLaps(L):null}
    else x.etapas=null; // sem arquivo (ex.: corrida vinda do Strava)
    LS.set('ax5',AX);
  }catch(e){} // sem internet: tenta de novo na próxima vez
}
// nomes das etapas: do plano do dia quando o número de etapas confere; senão deduzidos (aquecimento, tiro/recuperação, desaquecimento)
const nomeCurto=e=>({'Aquecer':'Aquec.','Desaquecer':'Desaq.'}[e.nome]||e.nome)+(e.n?' '+e.r+'/'+e.n:'');
function nomearEtapas(E,a){
  const pl=planOn(a.date.slice(0,10)),fl=pl?flatSteps(pl):[];
  if(fl.length===E.length)return fl;
  const cnt={};E.forEach(e=>{if(e.idx!=null)cnt[e.idx]=(cnt[e.idx]||0)+1});
  const rep=Object.keys(cnt).filter(k=>cnt[k]>=2),seq={};let rap=null;
  if(rep.length===2){const pa=k=>{const s=E.filter(e=>String(e.idx)===k);return s.reduce((x,e)=>x+e.t,0)/s.reduce((x,e)=>x+e.d,0)};rap=pa(rep[0])<pa(rep[1])?rep[0]:rep[1]}
  return E.map((e,i)=>{
    if(e.idx==null)return {nome:'Volta '+(i+1)};
    if(rep.length===2&&cnt[e.idx]>=2){const k=seq[e.idx]=(seq[e.idx]||0)+1;return {nome:String(e.idx)===rap?'Tiro':'Rec.',r:k,n:cnt[e.idx]}}
    return {nome:i===0?'Aquecer':i===E.length-1?'Desaquecer':'Etapa '+(i+1)};
  });
}
// tempo com uma casa decimal, como o relógio mostra (0:50.9)
const fmtT1=s=>{if(s==null||!isFinite(s))return '--';const t=Math.round(s*10)/10,m=Math.floor(t/60),x=t-m*60;return m+':'+(x<10?'0':'')+x.toFixed(1)};
function etapasHtml(E,a){
  const N=nomearEtapas(E,a);
  return `<div class="sec">ETAPAS<small>${E.length} ETAPAS · ${fmtT(E.reduce((s,e)=>s+e.t,0))}</small></div><table><tr><th>Etapa</th><th class="r">Dist.</th><th class="r">Tempo</th><th class="r">Ritmo</th><th class="r">FC</th></tr>${E.map((e,i)=>{
    const n=N[i]||{nome:'Etapa '+(i+1)},pc=e.t/e.d*1000,dentro=n.pace&&pc>=Math.min(...n.pace)-5&&pc<=Math.max(...n.pace)+5;
    return `<tr><td style="font-family:var(--f)">${esc(nomeCurto(n))}</td><td class="r">${e.d>=1000?kmTxt((e.d/1000).toFixed(2))+' km':e.d+' m'}</td><td class="r">${fmtT1(e.t)}</td><td class="r ${dentro?'ok':''}">${fmtP(pc)}</td><td class="r dim">${e.hr||'--'}</td></tr>`}).join('')}</table>
  ${nomearEtapas(E,a).some((n,i)=>n.pace)?'<p class="empty" style="margin-top:6px">Ritmo em azul: dentro da meta do treino planejado.</p>':''}`;
}

/* ================= cartão para compartilhar (PNG com fundo transparente, para stories) ================= */
const CART={id:null,corta:1};
const SIMB=[[19.20,77.67,8.20],[39.82,59.64,12.99],[69.18,33.94,19.82]]; // os três discos do símbolo (cx, cy, r num quadro de 100)
// trajeto da corrida; por padrão sem os 200 m do começo e do fim, para não mostrar onde a pessoa mora
function cartTrack(id,corta){
  const a=((AX[id]||{}).map||[]).filter(q=>q&&isFinite(q[0])&&isFinite(q[1]));if(a.length<2)return [];
  let t=a;
  if(corta){let i=0,d=0;while(i<a.length-1&&d<200){d+=dM(a[i],a[i+1]);i++}let j=a.length-1;d=0;while(j>i&&d<200){d+=dM(a[j],a[j-1]);j--}const c=a.slice(i,j+1);if(c.length>=3)t=c}
  const st=Math.max(1,Math.ceil(t.length/700));return t.filter((_,k)=>k%st===0||k===t.length-1);
}
const tempoCart=s=>{s=Math.round(s||0);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h?`${h}h ${pad(m)}min`:`${m}min ${pad(x)}s`};
// imagem com fundo transparente: três dados empilhados (nome em cima, número embaixo), o trajeto em azul e o símbolo branco no pé
function drawCart(cv){
  const a=D.acts.find(x=>x.id===CART.id);if(!a||!cv)return;
  const W=1080,H=1440,ctx=cv.getContext('2d'),F='-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif';
  cv.width=W;cv.height=H;ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='alphabetic';ctx.shadowColor='rgba(0,0,0,.35)';ctx.shadowBlur=12;
  const pace=a.dist?a.mov/a.dist*1000:null,dados=[['Distância',km(a.dist).replace('.',',')+' km'],['Ritmo',fmtP(pace)+' /km'],['Tempo',tempoCart(a.mov)]];
  dados.forEach(([l,v],i)=>{const y=150+i*215;ctx.font=`600 40px ${F}`;ctx.fillText(l,W/2,y);ctx.font=`800 100px ${F}`;ctx.fillText(v,W/2,y+108)});
  const tr=cartTrack(CART.id,CART.corta);
  if(tr.length>1){
    const la0=tr.reduce((s,q)=>s+q[0],0)/tr.length,cs=Math.cos(la0*Math.PI/180),P=tr.map(q=>[q[1]*cs,-q[0]]);
    const xs=P.map(p=>p[0]),ys=P.map(p=>p[1]),x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
    const top=790,bw=700,bh=430,sc=Math.min(bw/((x1-x0)||1e-9),bh/((y1-y0)||1e-9)),ox=(W-(x1-x0)*sc)/2,oy=top+(bh-(y1-y0)*sc)/2;
    ctx.shadowBlur=10;ctx.lineJoin='round';ctx.lineCap='round';ctx.strokeStyle='#4a9eff';ctx.lineWidth=11;
    ctx.beginPath();P.forEach((p,i)=>{const X=ox+(p[0]-x0)*sc,Y=oy+(p[1]-y0)*sc;i?ctx.lineTo(X,Y):ctx.moveTo(X,Y)});ctx.stroke();
  }
  // rodapé: nome StepOn e o símbolo à direita, os dois juntos e centralizados
  ctx.shadowBlur=8;ctx.fillStyle='#fff';ctx.textAlign='left';
  const nome='StepOn',fs=58,gap=20,sz=70;ctx.font=`800 ${fs}px ${F}`;
  const tw=ctx.measureText(nome).width,x0=(W-(tw+gap+sz))/2,base=1322,cy0=base-fs*0.36;
  ctx.fillText(nome,x0,base);
  const sx=x0+tw+gap,sy=cy0-sz/2;
  for(const [cx,cy,r] of SIMB){ctx.beginPath();ctx.arc(sx+cx/100*sz,sy+cy/100*sz,r/100*sz,0,Math.PI*2);ctx.fill()}
}

const redirUri=()=>location.origin+location.pathname;
const b64u=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
let CONECTANDO=/[?&](code|error)=/.test(location.search)?'volta':'';
const btnEntrar=(st,lbl)=>CONECTANDO?`<button class="b pri full conectando" style="${st}" disabled>${CONECTANDO==='volta'?'Conectando':'Abrindo o Intervals'}<span class="pts"><i>.</i><i>.</i><i>.</i></span></button>${CONECTANDO==='volta'?'<p class="meta" style="margin:8px 0 0;text-align:center;line-height:1.5">Pode levar alguns segundos. Estamos buscando as suas corridas.</p>':''}`:`<button class="b pri full" style="${st}" onclick="entrarIntervals()">${lbl||'Entrar com o Intervals'}</button>`;

window.entrarIntervals=async()=>{
  if(!/^\d+$/.test(OAUTH.id))return toast('O LOGIN DO INTERVALS AINDA ESTÁ SENDO CONFIGURADO',3500);
  CONECTANDO='ida';render();
  const v=b64u(crypto.getRandomValues(new Uint8Array(48))),st=b64u(crypto.getRandomValues(new Uint8Array(16)));
  const ch=b64u(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v)));
  LS.set('oauth',{v,st,t:Date.now()});
  location.href=OAUTH.auth+'?'+new URLSearchParams({client_id:OAUTH.id,redirect_uri:redirUri(),response_type:'code',scope:OAUTH.scope,state:st,code_challenge:ch,code_challenge_method:'S256'});
};
async function trocaCodigo(body){
  try{const r=await fetch(OAUTH.token,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams(body)});
    return {ok:r.ok,status:r.status,j:await r.json().catch(()=>({}))}}
  catch(e){ // se o navegador bloquear a chamada direta, o servidor do app só repassa (não tem senha nenhuma)
    const r=await fetch(PUBURL+'/oauth/token',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    return {ok:r.ok,status:r.status,j:await r.json().catch(()=>({}))}}
}
async function voltaOAuth(){const was=CONECTANDO;try{return await voltaOAuth0()}finally{CONECTANDO='';if(was)render()}}
async function voltaOAuth0(){
  const q=new URLSearchParams(location.search);if(!q.get('code')&&!q.get('error'))return false;
  history.replaceState(null,'',redirUri());
  const o=LS.get('oauth',null);LS.set('oauth',null);
  if(q.get('error')){toast('ENTRADA CANCELADA NO INTERVALS',3000);return true}
  if(!o||o.st!==q.get('state')||Date.now()-o.t>15*60e3){toast('NÃO DEU PARA ENTRAR. TENTE DE NOVO',3500);return true}
  try{
    const R=await trocaCodigo({client_id:OAUTH.id,code:q.get('code'),code_verifier:o.v,redirect_uri:redirUri(),grant_type:'authorization_code'});
    if(!R.ok||!R.j.access_token)throw new Error(R.j.error_description||R.j.error||('HTTP '+R.status));
    let id=String((R.j.athlete&&R.j.athlete.id)||'');if(/^\d+$/.test(id))id='i'+id;
    CFG.token=R.j.access_token;CFG.key='';if(id)CFG.athlete=id;saveCfg();
    if(!CFG.athlete){const a=await api('/athlete/0');CFG.athlete=a.id;saveCfg()}
    OB={i:0,a:null};
    toast('CONECTADO // '+((R.j.athlete&&R.j.athlete.name)||''),2500);
    await sync(0);
  }catch(e){toast('NÃO DEU PARA ENTRAR // '+e.message,4500);render()}
  return true;
}

// reconhece o ID (i + números) e a chave (texto longo) mesmo colados juntos, com "API_KEY:" ou com espaços
function parseConn(txt){
  const t=String(txt||'').replace(/API[_ ]?KEY\s*[:=]?/ig,' ');
  const id=(t.match(/\bi\d{3,10}\b/i)||[])[0],toks=(t.match(/[A-Za-z0-9]{20,}/g)||[]).sort((a,b)=>b.length-a.length);
  return {id:id?id.toLowerCase():null,key:toks[0]||null};
}
function connVals(){
  let id=($('#c-ath').value||'').trim().toLowerCase();if(/^\d{3,10}$/.test(id))id='i'+id;
  const raw=($('#c-key').value||'').trim(),key=parseConn(raw).key||raw.replace(/^API[_ ]?KEY\s*[:=]?/i,'').replace(/\s+/g,'');
  return {id,key,idOk:/^i\d{3,10}$/.test(id),keyOk:/^[A-Za-z0-9]{16,}$/.test(key),vazio:!id&&!raw};
}
window.connStatus=()=>{
  const v=connVals(),st=$('#c-st'),go=$('#c-go');if(!st||!go)return;
  const ok=v.idOk&&v.keyOk;go.disabled=!ok;
  st.innerHTML=v.vazio?'':ok?'<span class="ok">✓ ID e chave encontrados. Agora é só tocar no botão abaixo.</span>'
    :!v.id?'<span class="warn">Falta o ID do atleta (começa com i).</span>':!v.idOk?'<span class="warn">O ID começa com a letra i, como i123456.</span>'
    :!v.key?'<span class="warn">Falta a chave de API.</span>':'<span class="warn">A chave parece incompleta. Copie ela inteira.</span>';
};
// colou os dois no mesmo campo, ou colou a chave no campo do ID: arruma sozinho
window.connIn=()=>{
  const a=$('#c-ath'),k=$('#c-key'),p=parseConn(a.value);
  if(p.id&&p.key){a.value=p.id;k.value=p.key}else if(!p.id&&p.key&&!k.value.trim()){k.value=p.key;a.value=''}

};

async function connTry(){

    st.innerHTML='<span class="bad">'+(/HTTP 40[13]/.test(e.message)?'O Intervals não aceitou esse ID com essa chave. Copie a chave de novo, inteira, e confira o ID.'

const testesFeitos=()=>PF?(PF.tests||{}):LS.get('vtests',{});

function testeAchado(){

const unitOf=s=>/km$/.test(s)?'km':/min$/.test(s)?'min':/\ds$/.test(s)?'s':'m';

const dM=(p,q)=>Math.hypot((p[0]-q[0])*111320,(p[1]-q[1])*111320*Math.cos(p[0]*Math.PI/180));
const cen=tr=>{let a=0,b=0;for(const q of tr){a+=q[0];b+=q[1]}return [a/tr.length,b/tr.length]};
function bestsOf(a,b0){const b={...(b0||{})};for(const [d] of CDIST)if(a.dist>=d*0.99&&a.dist<=d*1.05&&a.mov){const t=Math.round(a.mov*d/a.dist);if(!b[d]||t<b[d])b[d]=t}return b}

function buildPlaces(P){

  for(const u of P)for(const r of u.runs){const c=cen(r.map);let pl=L.find(l=>dM(l.c,c)<900);
    if(!pl){pl={c,runs:[]};L.push(pl)}pl.runs.push({u,r});const n=pl.runs.length;pl.c=[pl.c[0]+(c[0]-pl.c[0])/n,pl.c[1]+(c[1]-pl.c[1])/n]}
  L.sort((a,b)=>b.runs.length-a.runs.length);
  L.forEach((pl,i)=>{pl.i=i;pl.key=pl.c[0].toFixed(3)+','+pl.c[1].toFixed(3);pl.km=pl.runs.reduce((s,x)=>s+(x.r.dist||0),0)/1000;pl.users=[...new Set(pl.runs.map(x=>x.u.id))].length;
    pl.dists=CDIST.filter(([d])=>pl.runs.some(x=>x.r.best&&x.r.best[d]))

    let mx=0;pl.ref=0;for(const [d] of pl.dists){const n=board(pl,d).length;if(n>=mx){mx=n;pl.ref=d}}

}

function board(pl,d,ini,fim){const B={};for(const {u,r} of pl.runs){if(ini&&String(r.date).slice(0,10)<ini)continue;if(fim&&String(r.date).slice(0,10)>fim)continue;const t=r.best&&r.best[d];if(t&&(!B[u.id]||t<B[u.id].t))B[u.id]={u,t,date:r.date,id:r.id}}return Object.values(B).sort((a,b)=>a.t-b.t)}
// temporada mensal (zera todo dia 1): 1 ponto por km corrido no mês + bônus pelas marcas do mês em cada local (10, 6, 3 e 1)
const MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
function ranking(){
  const n=new Date(),ini=n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-01',P=people(),R={};PLC=buildPlaces(P);
  for(const u of P){const rm=u.runs.filter(r=>String(r.date).slice(0,10)>=ini),km=rm.reduce((t,r)=>t+(r.dist||0),0)/1000,tr=rm.filter(r=>(r.dist||0)>=1000).length;R[u.id]={u,km,tr,bonus:0,coroas:0}}
  for(const pl of PLC)for(const [d] of pl.dists)board(pl,d,ini).forEach((x,i)=>{const o=R[x.u.id];if(!o)return;o.bonus+=[10,6,3][i]||1;if(!i)o.coroas++});
  const L=Object.values(R).map(o=>({...o,pts:Math.round(o.km)+3*o.tr+o.bonus})).filter(o=>o.pts>0||o.u.me).sort((a,b)=>b.pts-a.pts);
  return {L,mes:MESES[n.getMonth()],dias:Math.ceil((new Date(n.getFullYear(),n.getMonth()+1,1)-n)/864e5)};
}

function trimTrack(tr){
  if(!tr||tr.length<6)return null;let a=0,d=0;while(a<tr.length-1&&d<200){d+=dM(tr[a],tr[a+1]);a++}
  let b=tr.length-1;d=0;while(b>a&&d<200){d+=dM(tr[b],tr[b-1]);b--}
  const t=tr.slice(a,b+1);if(t.length<3)return null;const st=Math.max(1,Math.ceil(t.length/80));
  return t.filter((_,i)=>i%st===0||i===t.length-1);
}

/* ================= níveis da conta: os pontos de cada temporada ficam guardados e sobem o nível =================
   pontos: 1 por km corrido, 3 por treino (a partir de 1 km) e o bônus das marcas de cada mês em cada local (10, 6, 3 e 1).
   Os níveis 1 a 5 são Iniciante, 6 a 10 Intermediário e 11 em diante Avançado. A curva sobe devagar: o 1º nível vem na 1ª semana,
   o Intermediário em uns 4 meses de 3 treinos por semana, o Avançado em cerca de 1 ano de treino constante. */
const NIVT=L=>L<=1?0:Math.round(25*Math.pow(L-1,1.8)); // pontos acumulados para chegar ao nível L
const FAIXA=['Iniciante','Intermediário','Avançado'];
const nivelXp=xp=>{let L=1;while(NIVT(L+1)<=xp)L++;return {L,base:NIVT(L),prox:NIVT(L+1),faixa:L<=5?0:L<=10?1:2}};
let _bt=null;
function bonusTodos(){ // bônus de marcas de cada atleta, mês a mês, com todo mundo que entrou no ranking
  const k=D.at+'|'+PUBL.length;if(_bt&&_bt.k===k)return _bt.v;
  const P=people(1),L=buildPlaces(P),meses=[...new Set(P.flatMap(u=>u.runs.map(r=>String(r.date).slice(0,7))))],B={};
  for(const m of meses){const ini=m+'-01',fim=m+'-31';for(const pl of L)for(const [d] of pl.dists)board(pl,d,ini,fim).forEach((x,i)=>{B[x.u.id]=(B[x.u.id]||0)+([10,6,3][i]||1)})}
  _bt={k,v:B};return B;
}
function meuXp(){ // todas as corridas (também as marcadas à mão) + o bônus das marcas
  const runs=D.acts.filter(isRun),km=runs.reduce((s,r)=>s+(r.dist||0),0)/1000,tr=runs.filter(r=>(r.dist||0)>=1000).length;
  return Math.round(km+3*tr+(bonusTodos()[CFG.athlete]||0));
}
function xpDe(u){ // de outra pessoa: o total que o app dela mandou; se não mandou, o que dá para calcular do que ela publicou
  if(Number.isFinite(u.xp)&&u.xp>0)return u.xp;
  const r=u.runs||[],km=r.reduce((s,x)=>s+(x.dist||0),0)/1000,tr=r.filter(x=>(x.dist||0)>=1000).length;
  return Math.round(km+3*tr+(bonusTodos()[u.id]||0));
}

/* ================= gravar corrida (GPS do celular) ================= */
// para quem não tem relógio: grava pelo celular e manda ao Intervals como arquivo GPX (pausas viram trechos separados)
// pontos: [hora ms, lat, lon, altitude, trecho]
let REC=LS.get('rec',null),RM=null,RWID=null,RTK=null,WL=null,FIX=null,RSEL={p:null,modo:'livre'};
// diagnóstico do GPS de cada gravação: pontos válidos e descartados, maior tempo sem sinal, vezes que o app saiu da tela
const gNovo=()=>({ok:0,fraco:0,salto:0,rej:0,max:0,lp:0,hid:0,ocN:0,ocMs:0,ult:0,avisa:0,perdeu:0});
if(REC&&!REC.g)REC.g=gNovo();
const hav=(a,b)=>{const r=Math.PI/180,x=Math.sin((b[0]-a[0])*r/2)**2+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin((b[1]-a[1])*r/2)**2;return 12742000*Math.asin(Math.sqrt(x))};
const recLive=()=>!!REC&&REC.st!=='idle';
const recMov=()=>REC?(REC.mov+(REC.st==='run'?Date.now()-REC.since:0))/1000:0;
const recKeep=()=>LS.set('rec',REC);
const isoLocal=ms=>{const d=new Date(ms);return ymd(d)+'T'+pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds())};
const locMsg=()=>/iPhone|iPad/.test(navigator.userAgent)?'PERMITA A LOCALIZAÇÃO NOS AJUSTES DO IPHONE':'PERMITA A LOCALIZAÇÃO NO NAVEGADOR';
const say=t=>{if(!LS.get('voz',1)||!window.speechSynthesis)return;try{if(speechSynthesis.pending)speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='pt-BR';u.rate=1.05;speechSynthesis.speak(u)}catch(e){}};
const paceVoz=s=>{s=Math.round(s);return Math.floor(s/60)+(s%60?' e '+(s%60):' em ponto')};
async function wake(on){try{if(on&&!WL&&navigator.wakeLock){WL=await navigator.wakeLock.request('screen');WL.addEventListener('release',()=>{WL=null})}else if(!on&&WL){await WL.release();WL=null}}catch(e){}}
// o iPhone para o GPS de um app quando ele sai da tela: anota quanto tempo ficou fora
document.addEventListener('visibilitychange',()=>{
  if(!recLive())return;const g=REC.g;
  if(document.visibilityState==='hidden'){if(REC.st==='run'&&!g.hid){g.hid=Date.now();recKeep()}}
  else{wake(1);if(g.hid){const ms=Date.now()-g.hid;g.hid=0;if(ms>3000){g.ocN++;g.ocMs+=ms;g.ult=ms;g.avisa=Date.now()+25000;say('O app ficou fora da tela. O GPS pode ter parado.')}recKeep()}}
});
/* treino guiado: o plano do dia vira uma lista de etapas (com as repetições abertas) que o app vai cumprindo pela distância ou pelo tempo */
const nomeE=e=>({'Rec.':'Recuperação','Aquecer':'Aquecimento','Desaquecer':'Desaquecimento'}[e.nome]||e.nome);
const fmtN=x=>String(Math.round(x*10)/10).replace('.',',');
const qtd=(e,voz)=>e.m?(e.m>=1000?fmtN(e.m/1000)+(voz?(e.m===1000?' quilômetro':' quilômetros'):' km'):Math.round(e.m)+(voz?' metros':' m')):(e.s>=60?fmtN(e.s/60)+(voz?(e.s===60?' minuto':' minutos'):' min'):Math.round(e.s)+(voz?' segundos':' s'));
function flatSteps(p){
  const mk=(s,r,n)=>{const m=/^([\d.]+)(km|m|min|s)$/.exec(s[1])||[],v=parseFloat(m[1])||0,u=m[2];return {nome:s[0],r,n,m:u==='km'?v*1000:u==='m'?v:0,s:u==='min'?v*60:u==='s'?v:0,pace:s[2]||null}};
  const st=p.steps,out=[];let i=0;
  while(i<st.length){const s=st[i];
    if(s[3]&&st[i+1]&&st[i+1][3]===s[3]){for(let r=1;r<=s[3];r++){out.push(mk(s,r,s[3]));out.push(mk(st[i+1],r,s[3]))}i+=2}
    else if(s[3]){for(let r=1;r<=s[3];r++)out.push(mk(s,r,s[3]));i++}
    else{out.push(mk(s,0,0));i++}}
  return out.filter(e=>e.m>0||e.s>0);
}
function wkSay(){
  const w=REC&&REC.wk;if(!w)return;
  if(w.i>=w.steps.length)return say('Treino concluído. Pode desacelerar e finalizar quando quiser.');
  const e=w.steps[w.i];
  say(`${nomeE(e)}${e.n?' '+e.r+' de '+e.n:''}. ${qtd(e,1)}${e.pace&&e.r<=1?'. Ritmo '+paceVoz((e.pace[0]+e.pace[1])/2):''}`);
}
function wkNext(manual){
  const w=REC.wk,e=w.steps[w.i],now=recMov(),dd=REC.dist-w.d0,tt=now-w.t0;
  w.laps.push({nome:e.nome,r:e.r,n:e.n,dist:Math.round(!manual&&e.m?e.m:dd),t:Math.round(!manual&&e.s?e.s:tt)});
  // etapa por distância: a sobra de metros passa para a próxima; por tempo: a sobra de segundos
  if(manual){w.d0=REC.dist;w.t0=now}else if(e.m){w.d0+=e.m;w.t0=now}else{w.t0+=e.s;w.d0=REC.dist}
  w.i++;w.av=0;recKeep();wkSay();
}
function wkStep(){
  const w=REC&&REC.wk;if(!w||REC.st!=='run')return;
  for(let k=0;k<30&&w.i<w.steps.length;k++){
    const e=w.steps[w.i],dd=REC.dist-w.d0,tt=recMov()-w.t0;
    if(e.m?dd>=e.m:tt>=e.s){wkNext(false);continue}
    if(e.m>=500&&e.m-dd<=100&&!w.av){w.av=1;say('Faltam 100 metros')}
    break;
  }
}
window.recSkip=()=>{if(REC&&REC.wk&&REC.wk.i<REC.wk.steps.length&&REC.st==='run'){wkNext(true);recUI()}};

// parciais anteriores na tela de gravação: km a km na corrida livre, etapa a etapa no treino guiado (as 4 últimas + a atual)
function parHtml(t,d,done){
  const w=REC&&REC.wk,it=[];
  const nc=e=>({'Rec.':'Rec.','Aquecer':'Aquec.','Desaquecer':'Desaq.'}[e.nome]||e.nome)+(e.n?' '+e.r:'');
  const dTxt=m=>m>=1000?(m/1000).toFixed(m%1000?2:0).replace('.',',')+' km':Math.round(m)+' m';
  if(w){
    w.laps.forEach(l=>it.push({p:l.dist>=20?l.t/l.dist*1000:null,t:l.t,lb:nc(l),sub:l.dist>=20?dTxt(l.dist):fmtT(l.t)}));
    if(w.i<w.steps.length){const e=w.steps[w.i],dd=REC.dist-w.d0,tt=recMov()-w.t0;if(dd>=20||tt>=10)it.push({p:dd>=20?tt/dd*1000:null,t:tt,lb:nc(e),sub:'agora',cur:1})}
  }else{
    REC.splits.forEach((s,i)=>it.push({p:s,lb:'km '+(i+1)}));
    const kd=d%1000;if(kd>=50)it.push({p:(t-done)/kd*1000,lb:'km '+(REC.splits.length+1),sub:'agora',cur:1});
  }
  if(!it.length)return `<div class="rpar-v">${w?'As etapas aparecem aqui assim que cada uma terminar.':'As parciais aparecem aqui a cada quilômetro.'}</div>`;
  const vs=it.slice(-5),sp=vs.filter(x=>x.p&&x.p<1200).map(x=>1/x.p),mn=Math.min(...sp),mx=Math.max(...sp);
  const alt=x=>!x.p||x.p>=1200?24:Math.round(34+(mx>mn?(1/x.p-mn)/(mx-mn):1)*36);
  return `<div class="rpar-h">${w?'ETAPAS (RITMO /KM)':'PARCIAIS (/KM)'}</div><div class="rpar">${vs.map(x=>`<div class="rp${x.cur?' cur':''}"><b>${x.p&&x.p<1200?fmtP(x.p):fmtT(x.t)}</b><i style="height:${alt(x)}px"></i><span>${esc(x.lb)}</span><small>${x.sub||''}</small></div>`).join('')}</div>`;
}
function wkUI(){
  const el=$('#r-wk'),w=REC&&REC.wk;if(!el)return;
  $('#r-run').classList.toggle('wkon',!!w);

  const e=w.steps[w.i],nx=w.steps[w.i+1],dd=REC.dist-w.d0,tt=recMov()-w.t0,cp=curPace();

    if(cp)alvo+=cp<lo-3?' · <span class="warn">mais rápido que a meta</span>':cp>hi+3?' · <span class="warn">mais lento que a meta</span>':' · <span class="ok">no ritmo</span>'}

    <div class="bar"><i style="width:${prog*100}%"></i></div><div class="meta" style="margin-top:5px">${alvo}</div>
    <div class="meta">${nx?'Depois: '+esc(nomeE(nx))+' · '+qtd(nx):'Última etapa'}</div></div>`;

function onPos(p){
  const c=p.coords,now=Date.now();FIX={acc:c.accuracy,ll:[c.latitude,c.longitude],t:now};
  if(REC&&REC.st==='run'){
    const g=REC.g,ts=p.timestamp||now;
    if(g.lp){const gap=Math.round((ts-g.lp)/1000);if(gap>g.max)g.max=gap}g.lp=ts;
    if(g.perdeu){g.perdeu=0;say('GPS de volta.')}
    if(c.accuracy>35)g.fraco++;
    else{
      const q=[ts,+c.latitude.toFixed(6),+c.longitude.toFixed(6),c.altitude!=null?Math.round(c.altitude*10)/10:null,REC.seg],L=REC.pts[REC.pts.length-1];
      let ok=true;
      if(L&&L[4]===q[4]){const d=hav([L[1],L[2]],[q[1],q[2]]),dt=(q[0]-L[0])/1000;
        if(dt<=0||d/dt>12){ // salto de GPS; se 3 pontos seguidos "saltam", o ponto antigo é que estava errado: recomeça o trecho daqui
          g.salto++;g.rej++;if(g.rej>=3){REC.seg++;q[4]=REC.seg;g.rej=0}else ok=false}
        else{g.rej=0;
          if(d<4&&dt<5)ok=false; // parado no lugar: não repete ponto
          else{const b=REC.dist;REC.dist+=d;if(Math.floor(REC.dist/1000)>Math.floor(b/1000)){const k=Math.floor(REC.dist/1000),t=recMov(),sp=t-REC.splits.reduce((s,x)=>s+x,0);REC.splits.push(sp);say(`${k} ${k>1?'quilômetros':'quilômetro'}. Ritmo ${paceVoz(sp)}.`)}}}}
      if(ok){REC.pts.push(q);g.ok++;recKeep()}
    }
    wkStep();
  }
  recDraw();recUI();
}
function recWatch(on){

  if(!on&&RWID!=null){navigator.geolocation.clearWatch(RWID);RWID=null}
}
// ritmo atual: últimos 30 s do trecho em andamento
function curPace(){const P=REC&&REC.pts,n=P?P.length:0;if(n<2||REC.st!=='run'||Date.now()-P[n-1][0]>15000)return null;let i=n-1,d=0;
  while(i>0&&P[n-1][0]-P[i-1][0]<=30000&&P[i-1][4]===P[n-1][4]){d+=hav([P[i-1][1],P[i-1][2]],[P[i][1],P[i][2]]);i--}
  const dt=(P[n-1][0]-P[i][0])/1000;return d>15&&dt>0?dt/d*1000:null}

  $('#r-pa').innerHTML=fmtP(curPace())+'<small>/km</small>';$('#r-pm').innerHTML=(d>50?fmtP(t/d*1000):'--')+'<small>/km</small>';
  const kd=d%1000;$('#r-pk').innerHTML=(kd>50?fmtP((t-done)/kd*1000):'--')+`<small> km ${Math.floor(d/1000)+1}</small>`;
  $('#r-gps').innerHTML=!FIX?'<span class="warn">PROCURANDO GPS…</span>':FIX.acc<=12?'<span class="ok">GPS ÓTIMO</span>':FIX.acc<=30?'<span class="ok">GPS BOM</span>':'<span class="bad">GPS FRACO</span>';
  $('#r-min').textContent=idle?'✕':'⌄';

  // avisos: sem sinal, ou app que saiu da tela
  let msg='';

    if(age>10){msg=`<span class="bad">SEM SINAL DE GPS HÁ ${Math.round(age)} s</span>`;if(age>15&&!g.perdeu){g.perdeu=1;say('GPS perdido.')}}
    else if(g.avisa>now)msg=`<span class="warn">O app ficou fora da tela por ${fmtT(g.ult/1000)}. O GPS parou nesse trecho.</span>`}
  const al=$('#r-al');al.innerHTML=msg;al.style.display=msg?'block':'none';
  wkUI();

    if(go){go.disabled=!ok;go.textContent=ok?'INICIAR':'GPS…'}

    if(gt&&gt.dataset.c!==cat){gt.dataset.c=cat;gt.innerHTML=cat==='ok'?'<span class="ok">✓ GPS pronto. Pode começar.</span>':cat==='busca'?'<span class="warn">Procurando o sinal de GPS. Fique em um lugar aberto…</span>':'<span class="warn">Sinal de GPS fraco. Espere ficar verde antes de começar.</span>'}}
  const want=idle?'i':st+(REC&&REC.wk?'w':'');
  if($('#r-ctl').dataset.st!==want){$('#r-ctl').dataset.st=want;
    $('#r-ctl').innerHTML=idle?`<button class="rbtn" id="r-go" onclick="recGo()" disabled>GPS…</button>`
      :st==='run'?`<button class="rbtn amb" onclick="recPause()">PAUSAR</button>${REC.wk?`<button class="rbtn" onclick="recSkip()">PULAR<br>ETAPA</button>`:''}`

}

  <label class="f">Nome da corrida</label><input id="r-nome" value="${esc(w?w.t:'Corrida')}">
  <button class="b pri full" style="margin-top:14px" onclick="recSave()">Salvar</button>
  <div class="grid g2" style="margin-top:8px"><button class="b" onclick="closeSheet()">Voltar a gravar</button><button class="b red" onclick="recTrash()">Descartar</button></div>`);
};
window.recTrash=()=>{if(!confirm('Descartar esta corrida? Ela não poderá ser recuperada.'))return;recClear();closeSheet();toast('CORRIDA DESCARTADA')};
function recClear(){REC=null;LS.set('rec',null);wake(0);recWatch(0);clearInterval(RTK);RTK=null;$('#rec').classList.remove('on');$('#rec').innerHTML='';if(RM){RM.remove();RM=null}render()}
function toGpx(name){
  let s=`<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="StepOn" xmlns="http://www.topografix.com/GPX/1/1"><metadata><time>${new Date(REC.pts[0][0]).toISOString()}</time></metadata><trk><name>${esc(name)}</name><type>running</type>`,seg=null;
  for(const q of REC.pts){if(q[4]!==seg){if(seg!==null)s+='</trkseg>';s+='<trkseg>';seg=q[4]}s+=`<trkpt lat="${q[1]}" lon="${q[2]}">${q[3]!=null?`<ele>${q[3]}</ele>`:''}<time>${new Date(q[0]).toISOString()}</time></trkpt>`}
  return s+'</trkseg></trk></gpx>';
}
async function upGpx(name,gpx){
  const fd=new FormData();fd.append('file',new Blob([gpx],{type:'application/gpx+xml'}),'stepon.gpx');
  const r=await fetch(`${API}/athlete/${CFG.athlete}/activities?name=${encodeURIComponent(name)}`,{method:'POST',headers:{Authorization:authH()},body:fd});
  if(!r.ok)throw new Error('HTTP '+r.status);
}
window.recSave=async()=>{
  if(!REC.pts.length)return toast('SEM PONTOS DE GPS PARA SALVAR');
  const name=$('#r-nome').value.trim()||'Corrida',gpx=toGpx(name),btn=document.querySelector('#sbox .b.pri');btn.disabled=true;btn.textContent='Enviando…';
  try{await upGpx(name,gpx);toast('CORRIDA SALVA NO INTERVALS',3000);closeSheet();recClear();setTimeout(()=>sync(0),5000)}
  catch(e){ // sem internet ou o Intervals recusou: guarda no celular e deixa reenviar depois
    const {t0,t,d}=recStats(),id='man-'+Date.now();
    AX[id]=analyze(t,d,[],[],{data:REC.pts.map(q=>q[1]),data2:REC.pts.map(q=>q[2])});LS.set('ax5',AX);LS.set('gpx.'+id,gpx);
    MAN.push({id,date:isoLocal(t0),type:'Run',name,dist:Math.round(REC.dist),mov:Math.round(recMov()),el:Math.round(t[t.length-1]||0),src:'APP',gpx:1});LS.set('man',MAN);
    D.acts=withMan(D.acts);LS.set('data',D);closeSheet();recClear();toast('SALVA NESTE CELULAR // REENVIE PELO DETALHE DA CORRIDA',4500)}
};
window.resendGpx=async id=>{
  const a=MAN.find(m=>m.id===id),gpx=LS.get('gpx.'+id,null);if(!a||!gpx)return;
  try{await upGpx(a.name,gpx);MAN=MAN.filter(m=>m.id!==id);LS.set('man',MAN);LS.set('gpx.'+id,null);D.acts=withMan(D.acts);LS.set('data',D);closeSheet();toast('ENVIADA AO INTERVALS',3000);setTimeout(()=>sync(0),5000)}
  catch(e){toast('AINDA NÃO DEU // '+e.message,3500)}
};
if(recLive()){recWatch(1);RTK=setInterval(recUI,1000);
  const g=REC.g;if(g.hid){const ms=Date.now()-g.hid;g.hid=0;if(ms>3000){g.ocN++;g.ocMs+=ms;g.ult=ms;g.avisa=Date.now()+25000}recKeep()}}

/* ================= tema claro (gelo) e escuro ================= */
const SOL='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>';
const LUA='<svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>';
function temaIcone(){const l=TEMA()==='light';$('#tema').innerHTML=l?LUA:SOL;$('#tema').setAttribute('aria-label',l?'Modo escuro':'Modo claro');
  document.querySelector('meta[name=theme-color]').content=l?'#3b8ef5':'#000000'}
window.togTema=()=>{
  const l=TEMA()!=='light';if(l)document.documentElement.dataset.theme='light';else delete document.documentElement.dataset.theme;LS.set('tema',l?'light':'dark');temaIcone();
  // os mapas são refeitos com a paleta nova
  if(CM){CM.remove();CM=null;const c=$('#cmap');if(c)c.parentNode.innerHTML=''}
  if(RM){RM.remove();RM=null;$('#rec').innerHTML='';if($('#rec').classList.contains('on'))openRec()}
  render();
};
temaIcone();

/* ================= navegação ================= */
const TITLES={ini:'INÍCIO',cal:'CALENDÁRIO',des:'DESAFIOS',comp:'MAPA',mais:'MAIS',perf:'PERFIL'};
let VIEW='ini';
function go2(v){document.querySelectorAll('.view').forEach(e=>e.classList.toggle('on',e.id==='v-'+v));document.querySelectorAll('#tabbar button').forEach(b=>b.classList.toggle('on',b.dataset.v===v))}
function go(v){VIEW=v;go2(v);render()}
document.querySelectorAll('#tabbar button').forEach(b=>b.onclick=()=>go(b.dataset.v));
$('#av').onclick=()=>go(VIEW==='perf'?'ini':'perf');
$('#sync').onclick=()=>sync(0);
// junta cada título de seção (.sec) com o conteúdo dele num bloco, para as colunas não cortarem uma seção ao meio
function groupBlocks(el){const K=[...el.children];if(!K.length||K[0].classList.contains('blk'))return;let b=null;
  for(const k of K){if(!b||k.classList.contains('sec')){b=document.createElement('div');b.className='blk';el.insertBefore(b,k)}b.appendChild(k)}}
function render(){
  const ob=needOB();document.body.classList.toggle('ob',ob);
  const fab=$('#recfab');fab.classList.toggle('on',!ob&&temConta()&&(VIEW==='ini'||recLive())&&!$('#rec').classList.contains('on'));fab.classList.toggle('live',recLive());
  if(ob){document.querySelectorAll('.view').forEach(e=>e.classList.toggle('on',e.id==='v-ini'));$('#ttl').textContent='BOAS-VINDAS';rOB();return}
  if(VIEW==='ini'||!$('#v-'+VIEW).classList.contains('on'))go2(VIEW);
  $('#ttl').textContent=TITLES[VIEW];
  $('#avimg').src=myPic();
  $('#avst').className=D.at&&Date.now()-D.at<864e5?'on':D.at?'off':'';
  ({ini:rIni,cal:rCal,des:rDes,comp:rComp,mais:rMais,perf:rPerf})[VIEW]();
  if(['ini','des','mais','perf'].includes(VIEW))groupBlocks($('#'+VIEW));
  drawMaps();
}
window.sync=sync;window.sendWatch=sendWatch;
render();
voltaOAuth().then(v=>{if(!v&&temConta()&&(!D.at||Date.now()-D.at>30*60e3))sync(0)});
</script>
</body>
</html>
